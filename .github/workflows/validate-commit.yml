name: Validate commit

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate commit metadata and copyright
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate commit messages
        id: commit_messages
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/validate-commit-message.py

      - name: Validate copyright headers
        id: copyright
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/validate-copyright-headers.sh

      - name: Report validation results
        if: always()
        env:
          COMMIT_MESSAGES_OUTCOME: ${{ steps.commit_messages.outcome }}
          COPYRIGHT_OUTCOME: ${{ steps.copyright.outcome }}
        run: |
          echo "## Commit validation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit messages: ${COMMIT_MESSAGES_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Copyright headers: ${COPYRIGHT_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${COMMIT_MESSAGES_OUTCOME}" != "success" ]; then
            echo "::error title=Commit-message validation failed::See the dedicated validation step above."
          fi
          if [ "${COPYRIGHT_OUTCOME}" != "success" ]; then
            echo "::error title=Copyright validation failed::See the dedicated validation step above."
          fi
          if [ "${COMMIT_MESSAGES_OUTCOME}" != "success" ] || [ "${COPYRIGHT_OUTCOME}" != "success" ]; then
            exit 1
          fi
