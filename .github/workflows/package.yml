name: Packages `totalcross`

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      signed-ios: true
    secrets: inherit

  package_totalcross:
    name: Package TotalCross
    if: ${{ always() }}
    needs: build
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.totalcross-version.outputs.version }}

    steps:
    - name: Checkout packaging validation
      uses: actions/checkout@v6

    - name: Download SDK build artifacts
      id: download_sdk_build
      uses: actions/download-artifact@v4.1.7
      with:
        name: sdk-build
        path: .

    - name: Extract SDK build artifacts
      run: tar -xzf sdk-build.tar.gz
 
    - name: Download Linux amd64
      id: download_linux_amd64
      continue-on-error: true
      uses: actions/download-artifact@v4.1.7
      with:
        name: linux-amd64
        path: linux-amd64

    - name: Manage Linux amd64 files
      if: ${{ steps.download_linux_amd64.outcome == 'success' }}
      run: |
        linux_vm="$(find linux-amd64 -type f -name 'libtcvm.so' -print -quit)"
        linux_launcher="$(find linux-amd64 -type f -name 'Launcher' -print -quit)"
        if [ -z "${linux_vm}" ] || [ -z "${linux_launcher}" ]; then
          echo "Linux amd64 artifact is missing libtcvm.so or Launcher" >&2
          exit 1
        fi

        mkdir -p build/TotalCross/dist/vm/linux
        mkdir -p build/TotalCross/etc/launchers/linux
        cp -p -a -R "${linux_vm}" build/TotalCross/dist/vm/linux/
        cp -p -a -R "${linux_launcher}" build/TotalCross/etc/launchers/linux/
 
    - name: Download Linux arm32
      id: download_linux_arm32
      continue-on-error: true
      uses: actions/download-artifact@v4.1.7
      with:
        name: linux-arm32v7
        path: linux-arm32v7
 
    - name: Manage Linux arm32 files
      if: ${{ steps.download_linux_arm32.outcome == 'success' }}
      run: |
        linux_vm="$(find linux-arm32v7 -type f -name 'libtcvm.so' -print -quit)"
        linux_launcher="$(find linux-arm32v7 -type f -name 'Launcher' -print -quit)"
        if [ -z "${linux_vm}" ] || [ -z "${linux_launcher}" ]; then
          echo "Linux arm32 artifact is missing libtcvm.so or Launcher" >&2
          exit 1
        fi

        mkdir -p build/TotalCross/dist/vm/linux_arm
        mkdir -p build/TotalCross/etc/launchers/linux_arm
        cp -p -a -R "${linux_vm}" build/TotalCross/dist/vm/linux_arm/
        cp -p -a -R "${linux_launcher}" build/TotalCross/etc/launchers/linux_arm/

    - name: Download Linux arm64
      id: download_linux_arm64
      continue-on-error: true
      uses: actions/download-artifact@v4.1.7
      with:
        name: linux-arm64
        path: linux-arm64

    - name: Manage Linux arm64 files
      if: ${{ steps.download_linux_arm64.outcome == 'success' }}
      run: |
        linux_vm="$(find linux-arm64 -type f -name 'libtcvm.so' -print -quit)"
        linux_launcher="$(find linux-arm64 -type f -name 'Launcher' -print -quit)"
        if [ -z "${linux_vm}" ] || [ -z "${linux_launcher}" ]; then
          echo "Linux arm64 artifact is missing libtcvm.so or Launcher" >&2
          exit 1
        fi

        mkdir -p build/TotalCross/dist/vm/linux_arm64
        mkdir -p build/TotalCross/etc/launchers/linux_arm64
        cp -p -a -R "${linux_vm}" build/TotalCross/dist/vm/linux_arm64/
        cp -p -a -R "${linux_launcher}" build/TotalCross/etc/launchers/linux_arm64/

    - name: Download macOS ARM64
      id: download_macos_arm64
      continue-on-error: true
      uses: actions/download-artifact@v4.1.7
      with:
        name: macos-arm64
        path: macos-arm64

    - name: Manage macOS ARM64 files
      if: ${{ steps.download_macos_arm64.outcome == 'success' }}
      run: |
        macos_vm="$(find macos-arm64 -type f -name 'libtcvm.dylib' -print -quit)"
        macos_launcher="$(find macos-arm64 -type f -name 'Launcher' -print -quit)"
        if [ -z "${macos_vm}" ] || [ -z "${macos_launcher}" ]; then
          echo "macOS ARM64 artifact is missing libtcvm.dylib or Launcher" >&2
          exit 1
        fi

        mkdir -p build/TotalCross/dist/vm/macos
        mkdir -p build/TotalCross/etc/launchers/macos
        cp -p -a -R "${macos_vm}" build/TotalCross/dist/vm/macos/
        cp -p -a -R "${macos_launcher}" build/TotalCross/etc/launchers/macos/

    - name: Download Windows
      id: download_windows
      continue-on-error: true
      uses: actions/download-artifact@v4.1.7
      with:
        name: windows
        path: windows

    - name: Manage Windows files
      if: ${{ steps.download_windows.outcome == 'success' }}
      shell: bash
      run: |
        windows_vm="$(find windows -type f -iname 'tcvm.dll' -print -quit)"
        windows_launcher="$(find windows -type f -iname 'launcher.exe' -print -quit)"
        if [ -z "${windows_vm}" ] || [ -z "${windows_launcher}" ]; then
          echo "Windows artifact is missing tcvm.dll or launcher.exe" >&2
          exit 1
        fi

        mkdir -p build/TotalCross/dist/vm/win32
        mkdir -p build/TotalCross/etc/launchers/win32
        cp -p -a -R "${windows_vm}" build/TotalCross/dist/vm/win32/tcvm.dll
        cp -p -a -R "${windows_launcher}" build/TotalCross/etc/launchers/win32/Launcher.exe

    - name: Download Android
      id: download_android
      continue-on-error: true
      uses: actions/download-artifact@v4.1.7
      with:
        name: android
        path: android

    - name: Manage Android files
      if: ${{ steps.download_android.outcome == 'success' }}
      shell: bash
      run: |
        android_artifact="$(find android -name "TotalCross.aab" -type f -print -quit)"
        if [ -z "$android_artifact" ]; then
          echo "Could not find TotalCross.aab in Android build artifact" >&2
          exit 1
        fi

        mkdir -p build/TotalCross/dist/vm/android
        mkdir -p build/TotalCross/etc/launchers/android
        mkdir -p build/TotalCross/etc/tools/android
        cp -p -a -R "$android_artifact" build/TotalCross/dist/vm/android/TotalCross.aab

    - name: Download iOS
      id: download_ios
      continue-on-error: true
      uses: actions/download-artifact@v4.1.7
      with:
        name: ios
        path: ios

    - name: Manage iOS files
      if: ${{ steps.download_ios.outcome == 'success' }}
      shell: bash
      run: |
        mkdir -p build/TotalCross/dist/vm/ios
        mkdir -p build/TotalCross/etc/tools/iOSCodesign
        mkdir -p ios/extracted
        tar -xzf ios/ios.tar.gz -C ios/extracted
        cp -p -a -R ios/extracted/TotalCross.xcarchive build/TotalCross/etc/tools/iOSCodesign/
        cp -p -a ios/extracted/TotalCross.ipa/TotalCross.ipa build/TotalCross/dist/vm/ios/

    - name: Validate build artifact provenance
      if: ${{ always() }}
      shell: bash
      env:
        EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        LINUX_AMD64_DOWNLOAD_OUTCOME: ${{ steps.download_linux_amd64.outcome }}
        LINUX_ARM32_DOWNLOAD_OUTCOME: ${{ steps.download_linux_arm32.outcome }}
        LINUX_ARM64_DOWNLOAD_OUTCOME: ${{ steps.download_linux_arm64.outcome }}
        MACOS_ARM64_DOWNLOAD_OUTCOME: ${{ steps.download_macos_arm64.outcome }}
        WINDOWS_DOWNLOAD_OUTCOME: ${{ steps.download_windows.outcome }}
        ANDROID_DOWNLOAD_OUTCOME: ${{ steps.download_android.outcome }}
        IOS_DOWNLOAD_OUTCOME: ${{ steps.download_ios.outcome }}
      run: |
        expected_source_tree="$(git rev-parse "HEAD^{tree}")"
        artifact_downloads=(
          --artifact-download "sdk=success=."
          --artifact-download "linux-amd64=${LINUX_AMD64_DOWNLOAD_OUTCOME}=linux-amd64"
          --artifact-download "linux-arm32v7=${LINUX_ARM32_DOWNLOAD_OUTCOME}=linux-arm32v7"
          --artifact-download "linux-arm64=${LINUX_ARM64_DOWNLOAD_OUTCOME}=linux-arm64"
          --artifact-download "macos-arm64=${MACOS_ARM64_DOWNLOAD_OUTCOME}=macos-arm64"
          --artifact-download "windows=${WINDOWS_DOWNLOAD_OUTCOME}=windows"
          --artifact-download "android=${ANDROID_DOWNLOAD_OUTCOME}=android"
          --artifact-download "ios=${IOS_DOWNLOAD_OUTCOME}=ios"
        )
        python3 scripts/validate-build-provenance.py \
          "${artifact_downloads[@]}" \
          --repository "${GITHUB_REPOSITORY}" \
          --source-commit "${EXPECTED_SOURCE_COMMIT}" \
          --source-tree "${expected_source_tree}" \
          --require-clean-source \
          --require-build-identity

    - name: Validate embedded build identities
      if: ${{ always() }}
      shell: bash
      env:
        LINUX_AMD64_DOWNLOAD_OUTCOME: ${{ steps.download_linux_amd64.outcome }}
        LINUX_ARM32_DOWNLOAD_OUTCOME: ${{ steps.download_linux_arm32.outcome }}
        LINUX_ARM64_DOWNLOAD_OUTCOME: ${{ steps.download_linux_arm64.outcome }}
        MACOS_ARM64_DOWNLOAD_OUTCOME: ${{ steps.download_macos_arm64.outcome }}
        WINDOWS_DOWNLOAD_OUTCOME: ${{ steps.download_windows.outcome }}
        ANDROID_DOWNLOAD_OUTCOME: ${{ steps.download_android.outcome }}
        IOS_DOWNLOAD_OUTCOME: ${{ steps.download_ios.outcome }}
      run: |
        expected_source_tree="$(git rev-parse "HEAD^{tree}")"
        artifact_downloads=(
          --artifact-download "sdk=success=build/TotalCross"
          --artifact-download "linux-amd64=${LINUX_AMD64_DOWNLOAD_OUTCOME}=linux-amd64"
          --artifact-download "linux-arm32v7=${LINUX_ARM32_DOWNLOAD_OUTCOME}=linux-arm32v7"
          --artifact-download "linux-arm64=${LINUX_ARM64_DOWNLOAD_OUTCOME}=linux-arm64"
          --artifact-download "macos-arm64=${MACOS_ARM64_DOWNLOAD_OUTCOME}=macos-arm64"
          --artifact-download "windows=${WINDOWS_DOWNLOAD_OUTCOME}=windows"
          --artifact-download "android=${ANDROID_DOWNLOAD_OUTCOME}=android"
          --artifact-download "ios=${IOS_DOWNLOAD_OUTCOME}=ios"
        )
        python3 scripts/provenance/artifact-identity.py \
          "${artifact_downloads[@]}" \
          --repository "${GITHUB_REPOSITORY}" \
          --source-tree "${expected_source_tree}"

    - name: Read TotalCross version
      id: totalcross-version
      shell: bash
      run: |
        version="$(find build/TotalCross/dist -maxdepth 1 -type f -regex '.*/totalcross-sdk-[0-9]+\.[0-9]+\.[0-9]+\.jar' -print -quit)"
        version="${version##*/}"
        version="${version#totalcross-sdk-}"
        version="${version%.jar}"
        if [ -z "$version" ]; then
          echo "Could not determine TotalCross version from packaged SDK jar" >&2
          exit 1
        fi

        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Create packaged SDK zip
      shell: bash
      run: |
        cd build
        zip -r "TotalCross-${{ steps.totalcross-version.outputs.version }}.zip" TotalCross

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TotalCross-${{ steps.totalcross-version.outputs.version }}
        path: build/TotalCross-${{ steps.totalcross-version.outputs.version }}.zip

    - name: Upload dist jars
      uses: actions/upload-artifact@v4
      with:
        name: TotalCross-${{ steps.totalcross-version.outputs.version }}-jars
        path: build/TotalCross/dist/*.jar

  test_packaged_zip:
    name: Test packaged ZIP on ${{ matrix.name }}
    needs: package_totalcross
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86/64
            runner: windows-2022
          - name: macOS ARM
            runner: macos-15
          - name: Linux x86/64
            runner: ubuntu-22.04

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Download packaged SDK zip
      uses: actions/download-artifact@v4.1.7
      with:
        name: TotalCross-${{ needs.package_totalcross.outputs.version }}
        path: packaged

    - name: Test packaged SDK deploy
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $zipPath = Join-Path 'packaged' 'TotalCross-${{ needs.package_totalcross.outputs.version }}.zip'
        $extractPath = Join-Path $PWD 'packaged-sdk'
        Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

        $env:TOTALCROSS3_HOME = Join-Path $extractPath 'TotalCross'
        "TOTALCROSS3_HOME=$env:TOTALCROSS3_HOME" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        $sdkJar = Join-Path $env:TOTALCROSS3_HOME 'dist/totalcross-sdk-${{ needs.package_totalcross.outputs.version }}.jar'
        if (-not (Test-Path -LiteralPath $sdkJar -PathType Leaf)) {
          throw "Packaged SDK jar not found: $sdkJar"
        }

        $workDir = Join-Path $PWD 'package-test'
        New-Item -ItemType Directory -Force -Path $workDir | Out-Null

        @'
        import totalcross.ui.Label;
        import totalcross.ui.MainWindow;

        public class HelloWorld extends MainWindow {

            @Override
            public void initUI() {
                add(new Label("Hello World"), CENTER, CENTER);
            }
        }
        '@ | Set-Content -Path (Join-Path $workDir 'HelloWorld.java') -Encoding utf8

        javac -source 7 -target 7 -cp $sdkJar -d $workDir (Join-Path $workDir 'HelloWorld.java')

        $distLibs = Join-Path $env:TOTALCROSS3_HOME 'dist/libs'
        $distLibJars = @()
        if (Test-Path -LiteralPath $distLibs -PathType Container) {
          $distLibJars = @(
            Get-ChildItem -LiteralPath $distLibs -Filter '*.jar' -File |
              Sort-Object -Property FullName |
              Select-Object -ExpandProperty FullName
          )
        }
        $appDirsJar = Join-Path $distLibs 'appdirs-1.2.0.jar'
        if (-not (Test-Path -LiteralPath $appDirsJar -PathType Leaf)) {
          Write-Host "Packaged dist directory:"
          Get-ChildItem -LiteralPath (Join-Path $env:TOTALCROSS3_HOME 'dist') -Recurse -Force |
            ForEach-Object { Write-Host "  $($_.FullName)" }
          throw "Required packaged SDK dependency not found: $appDirsJar"
        }

        $distLibsWildcard = Join-Path $distLibs '*'
        $deployClasspathEntries = @($sdkJar, $distLibsWildcard)
        $deployClasspath = [string]::Join([string][IO.Path]::PathSeparator, [string[]]$deployClasspathEntries)

        Write-Host 'Packaged dist/libs jars:'
        foreach ($jar in $distLibJars) {
          Write-Host "  $jar"
        }
        Write-Host 'Deploy classpath entries:'
        foreach ($entry in $deployClasspathEntries) {
          Write-Host "  $entry"
        }
        Write-Host "Deploy classpath: $deployClasspath"

        Push-Location $workDir
        try {
          java -cp $deployClasspath tc.Deploy (Join-Path $workDir 'HelloWorld.class') -win32 -android -ios -linux -linux_arm -macos /n 'Hello World'
        } finally {
          Pop-Location
        }

        $installDir = Join-Path $workDir 'install'
        $expectedFiles = @(
          'win32/Hello World.exe',
          'win32/Hello World.tcz',
          'win32/tcvm.dll',
          'android/HelloWorld.aab',
          'android/HelloWorld.apk',
          'ios/Hello World.ipa',
          'linux/Hello World',
          'linux/Hello World.tcz',
          'linux/libtcvm.so',
          'linux_arm/Hello World',
          'linux_arm/Hello World.tcz',
          'linux_arm/libtcvm.so',
          'macos/Hello World',
          'macos/Hello World.tcz',
          'macos/libtcvm.dylib'
        )

        foreach ($file in $expectedFiles) {
          $path = Join-Path $installDir $file
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Expected deploy artifact not found: $path"
          }
        }

        $expectedDirectories = @('win32', 'android', 'ios', 'linux', 'linux_arm', 'macos')
        foreach ($directory in $expectedDirectories) {
          $path = Join-Path $installDir $directory
          if (-not (Test-Path -LiteralPath $path -PathType Container)) {
            throw "Expected deploy directory not found: $path"
          }
        }
