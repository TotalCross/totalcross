name: Merge flow
on:
  workflow_dispatch:
    inputs:
      image-string-smoke:
        description: Run deployed Image(String) filesystem smokes on Android, Windows, and Linux
        required: false
        type: boolean
        default: false
      image-string-linux-diagnostic:
        description: Run the Linux PNG feed diagnostic without other platform smokes
        required: false
        type: boolean
        default: false
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      selective: ${{ github.event_name == 'pull_request' }}
      image-string-smoke: ${{ inputs.image-string-smoke }}
      image-string-linux-diagnostic: ${{ inputs.image-string-linux-diagnostic }}
    secrets: inherit
