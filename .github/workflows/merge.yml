name: Merge flow
on:
  workflow_dispatch:
    inputs:
      image_ownership_smoke:
        description: Run native persistent image ownership smokes on Android, Windows, and Linux
        required: false
        type: boolean
        default: false
      windows_x64_image_ownership_smoke:
        description: Run only the native Windows x64 persistent image ownership smoke
        required: false
        type: boolean
        default: false
      source_sha:
        description: Exact TotalCross commit whose artifacts will be built and tested
        required: false
        type: string
        default: ''
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      selective: ${{ github.event_name == 'pull_request' }}
      image_ownership_smoke: ${{ inputs.image_ownership_smoke }}
      windows_x64_image_ownership_smoke: ${{ inputs.windows_x64_image_ownership_smoke }}
      source_sha: ${{ inputs.source_sha }}
    secrets: inherit
