name: Merge flow
on:
  workflow_dispatch:
    inputs:
      ios-xcode-cache-experiment:
        description: Experiment with iOS Xcode intermediate caching (unsigned manual build only)
        required: false
        type: boolean
        default: false
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      selective: ${{ github.event_name == 'pull_request' }}
      ios-xcode-cache-experiment: ${{ inputs.ios-xcode-cache-experiment || false }}
    secrets: inherit
