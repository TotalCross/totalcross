name: Build
on:
  workflow_call:
    inputs:
      signed-ios:
        description: Build and export a signed iOS IPA
        required: false
        type: boolean
        default: false
      selective:
        description: Limit builds to the scope implied by pull request changes
        required: false
        type: boolean
        default: false
      image-string-smoke:
        description: Run deployed Image(String) filesystem smokes on Android, Windows, and Linux
        required: false
        type: boolean
        default: false
      image-string-linux-diagnostic:
        description: Run the Linux PNG feed diagnostic without other platform smokes
        required: false
        type: boolean
        default: false
      image-string-linux-baseline-comparison:
        description: Compare deployed Image(File)/Image(byte[]) PNG decoding on master baseline and feature using Linux x64 only
        required: false
        type: boolean
        default: false

env:
  SQLITE3_GITHUB_TOKEN: ${{ secrets.SQLITE3_GITHUB_TOKEN }}
  ZLIB_NG_GITHUB_TOKEN: ${{ secrets.ZLIB_NG_GITHUB_TOKEN }}
  MINIZIP_NG_GITHUB_TOKEN: ${{ secrets.MINIZIP_NG_GITHUB_TOKEN }}
  LIBPNG_GITHUB_TOKEN: ${{ secrets.LIBPNG_GITHUB_TOKEN }}
  MBEDTLS_GITHUB_TOKEN: ${{ secrets.MBEDTLS_GITHUB_TOKEN }}
  AXTLS_GITHUB_TOKEN: ${{ secrets.AXTLS_GITHUB_TOKEN }}
  SKIA_GITHUB_TOKEN: ${{ secrets.SKIA_GITHUB_TOKEN }}
  LIBJPEG_TURBO_GITHUB_TOKEN: ${{ secrets.LIBJPEG_TURBO_GITHUB_TOKEN }}
  SDL2_GITHUB_TOKEN: ${{ secrets.SDL2_GITHUB_TOKEN }}

jobs:
  checkout-source:
    name: Checkout source code
    runs-on: ubuntu-22.04
    outputs:
      scope: ${{ steps.select_build_scope.outputs.scope }}

    steps:
    - name: Checkout source code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Validate provenance scripts
      run: |
        python3 scripts/test-build-provenance.py
        python3 scripts/test-build-identity.py
        python3 scripts/test-artifact-identity.py

    - name: Select build scope
      id: select_build_scope
      shell: bash
      env:
        SELECTIVE_BUILD: ${{ inputs.selective }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        scope=full

        if [ "${SELECTIVE_BUILD}" = "true" ]           && [ -n "${PR_BASE_SHA}" ]           && [ -n "${PR_HEAD_SHA}" ]
        then
          mapfile -t changed_files < <(
            git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}"
          )

          if [ "${#changed_files[@]}" -gt 0 ]; then
            docs_only=true
            sdk_only=true

            for path in "${changed_files[@]}"; do
              case "${path}" in
                *.md|docs/*|.agent/*|.agents/*|LICENSE|NOTICE)
                  ;;
                *)
                  docs_only=false
                  ;;
              esac

              case "${path}" in
                *.md|docs/*|.agent/*|.agents/*|LICENSE|NOTICE|TotalCrossSDK/*|scripts/package-sdk.sh)
                  ;;
                *)
                  sdk_only=false
                  ;;
              esac
            done

            if ${docs_only}; then
              scope=none
            elif ${sdk_only}; then
              scope=sdk
            fi
          fi
        fi

        printf 'scope=%s\n' "${scope}" >> "${GITHUB_OUTPUT}"
        printf 'Selected build scope: %s\n' "${scope}"

    - name: Validate commit
      uses: ./.github/actions/validate-commit
      with:
        event-name: ${{ github.event_name }}
        push-before: ${{ github.event.before }}
        push-after: ${{ github.sha }}
        pr-base-sha: ${{ github.event.pull_request.base.sha }}
        pr-head-sha: ${{ github.event.pull_request.head.sha }}

    - name: Record build provenance
      if: ${{ steps.select_build_scope.outputs.scope != 'none' }}
      shell: bash
      run: |
        python3 scripts/provenance/validate-compatibility.py --repository-root .
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        import subprocess
        import sys

        sys.path.insert(0, str(Path("scripts/provenance").resolve()))
        from compatibility_contract import read_compatibility_contract

        compatibility = read_compatibility_contract(
            Path("config/artifact-compatibility.properties")
        )

        Path("build-provenance.json").write_text(
            json.dumps({
                "schemaVersion": 1,
                "repository": os.environ["GITHUB_REPOSITORY"],
                "source": {
                    "commit": os.environ["GITHUB_SHA"],
                    "tree": subprocess.check_output(
                        ["git", "rev-parse", "HEAD^{tree}"], text=True
                    ).strip(),
                    "dirty": False,
                },
                "producer": {
                    "kind": "github-actions",
                    "runId": os.environ["GITHUB_RUN_ID"],
                    "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                },
                "compatibility": compatibility,
            }, sort_keys=True) + "\n",
            encoding="utf-8",
        )
        PY
        python3 scripts/provenance/build-identity.py \
          --repository-root . \
          --update-manifest build-provenance.json \
          --format id

    - name: Pack source code
      if: ${{ steps.select_build_scope.outputs.scope != 'none' }}
      run: tar --exclude=.git -czf "${RUNNER_TEMP}/source-code.tar.gz" .

    - name: Upload source code
      if: ${{ steps.select_build_scope.outputs.scope != 'none' }}
      uses: actions/upload-artifact@v7
      with:
        name: source-code
        path: ${{ runner.temp }}/source-code.tar.gz
        retention-days: 1

  prepare-native-dependencies:
    if: ${{ needs.checkout-source.outputs.scope == 'full' }}
    name: Prepare native dependencies
    needs: checkout-source
    runs-on: ubuntu-22.04

    steps:
    - name: Download source code
      uses: actions/download-artifact@v7
      with:
        name: source-code

    - name: Extract source code
      run: tar -xzf source-code.tar.gz

    - name: Export dependency overrides
      env:
        SQLITE3_RELEASE_TAG_OVERRIDE: ${{ secrets.SQLITE3_RELEASE_TAG }}
        SQLITE3_GITHUB_REPO_OVERRIDE: ${{ secrets.SQLITE3_GITHUB_REPO }}
        ZLIB_NG_RELEASE_TAG_OVERRIDE: ${{ secrets.ZLIB_NG_RELEASE_TAG }}
        ZLIB_NG_GITHUB_REPO_OVERRIDE: ${{ secrets.ZLIB_NG_GITHUB_REPO }}
        MINIZIP_NG_RELEASE_TAG_OVERRIDE: ${{ secrets.MINIZIP_NG_RELEASE_TAG }}
        MINIZIP_NG_GITHUB_REPO_OVERRIDE: ${{ secrets.MINIZIP_NG_GITHUB_REPO }}
        LIBPNG_RELEASE_TAG_OVERRIDE: ${{ secrets.LIBPNG_RELEASE_TAG }}
        LIBPNG_GITHUB_REPO_OVERRIDE: ${{ secrets.LIBPNG_GITHUB_REPO }}
        MBEDTLS_RELEASE_TAG_OVERRIDE: ${{ secrets.MBEDTLS_RELEASE_TAG }}
        MBEDTLS_GITHUB_REPO_OVERRIDE: ${{ secrets.MBEDTLS_GITHUB_REPO }}
        AXTLS_RELEASE_TAG_OVERRIDE: ${{ secrets.AXTLS_RELEASE_TAG }}
        AXTLS_GITHUB_REPO_OVERRIDE: ${{ secrets.AXTLS_GITHUB_REPO }}
        LIBJPEG_TURBO_RELEASE_TAG_OVERRIDE: ${{ secrets.LIBJPEG_TURBO_RELEASE_TAG }}
        LIBJPEG_TURBO_GITHUB_REPO_OVERRIDE: ${{ secrets.LIBJPEG_TURBO_GITHUB_REPO }}
        SKIA_RELEASE_TAG_OVERRIDE: ${{ secrets.SKIA_RELEASE_TAG }}
        SKIA_GITHUB_REPO_OVERRIDE: ${{ secrets.SKIA_GITHUB_REPO }}
        SDL2_RELEASE_TAG_OVERRIDE: ${{ secrets.SDL2_RELEASE_TAG }}
        SDL2_GITHUB_REPO_OVERRIDE: ${{ secrets.SDL2_GITHUB_REPO }}
      run: |
        for name in \
          SQLITE3_RELEASE_TAG SQLITE3_GITHUB_REPO \
          ZLIB_NG_RELEASE_TAG ZLIB_NG_GITHUB_REPO \
          MINIZIP_NG_RELEASE_TAG MINIZIP_NG_GITHUB_REPO \
          LIBPNG_RELEASE_TAG LIBPNG_GITHUB_REPO \
          MBEDTLS_RELEASE_TAG MBEDTLS_GITHUB_REPO \
          AXTLS_RELEASE_TAG AXTLS_GITHUB_REPO \
          LIBJPEG_TURBO_RELEASE_TAG LIBJPEG_TURBO_GITHUB_REPO \
          SKIA_RELEASE_TAG SKIA_GITHUB_REPO \
          SDL2_RELEASE_TAG SDL2_GITHUB_REPO
        do
          value_name="${name}_OVERRIDE"
          if [ -n "${!value_name:-}" ]; then
            printf '%s=%s\n' "$name" "${!value_name}" >> "$GITHUB_ENV"
          fi
        done

    - name: Cache depot tools
      uses: actions/cache@v5
      with:
        path: TotalCrossVM/deps/totalcross-depot-tools
        key: depot-tools-${{ hashFiles('TotalCrossVM/deps/fetch-depot-tools.sh', 'TotalCrossVM/deps/totalcross-depot-tools.ref') }}
        enableCrossOsArchive: true

    - name: Fetch depot tools metadata
      run: TotalCrossVM/deps/fetch-depot-tools.sh

    - name: Fetch native dependencies
      env:
        PREPARED_NATIVE_DEPENDENCIES_INDEX: ${{ runner.temp }}/prepared-native-dependencies-index.jsonl
      run: scripts/prepare-native-dependencies.sh

    - name: Package prepared native dependencies
      run: |
        args=(
          --depot-dir TotalCrossVM/deps/totalcross-depot-tools
          --index "${RUNNER_TEMP}/prepared-native-dependencies-index.jsonl"
          --output "${RUNNER_TEMP}/depot-tools-native-dependencies.tar.gz"
        )
        scripts/package-native-dependencies.py "${args[@]}"

    - name: Upload prepared native dependencies
      uses: actions/upload-artifact@v7
      with:
        name: prepared-native-dependencies
        path: ${{ runner.temp }}/depot-tools-native-dependencies.tar.gz
        if-no-files-found: error
        retention-days: 1

  generate-native-bridges:
    if: ${{ needs.checkout-source.outputs.scope == 'full' }}
    name: Generate native bridges
    needs: checkout-source
    runs-on: ubuntu-22.04

    steps:
    - name: Download source code
      uses: actions/download-artifact@v7
      with:
        name: source-code

    - name: Extract source code
      run: tar -xzf source-code.tar.gz

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Cache Gradle packages
      uses: actions/cache@v5
      with:
        path: ~/.gradle/caches
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
        restore-keys: ${{ runner.os }}-gradle

    - name: Generate native bridge sources
      working-directory: TotalCrossSDK
      run: ./gradlew-agent generateNativeBridgeSources

    - name: Upload generated native bridges
      uses: actions/upload-artifact@v7
      with:
        name: native-bridges
        path: TotalCrossSDK/build/generated/native-bridges
        if-no-files-found: error
        retention-days: 1

  build-linux:
    if: ${{ needs.checkout-source.outputs.scope == 'full' }}
    name: Build '${{ matrix.project }}'
    needs: [checkout-source, prepare-native-dependencies, generate-native-bridges]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON((inputs.image-string-smoke || inputs.image-string-linux-diagnostic || inputs.image-string-linux-baseline-comparison) && '{"include":[{"project":"linux-amd64","runner":"ubuntu-22.04","docker_platform":"linux/amd64","use_qemu":false}]}' || '{"include":[{"project":"linux-amd64","runner":"ubuntu-22.04","docker_platform":"linux/amd64","use_qemu":false},{"project":"linux-arm32v7","runner":"ubuntu-22.04","docker_platform":"linux/arm/v7","use_qemu":true},{"project":"linux-arm64","runner":"ubuntu-22.04-arm","docker_platform":"linux/arm64","use_qemu":false}]}') }}

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Download source code
      uses: actions/download-artifact@v7
      with:
        name: source-code

    - name: Extract source code
      run: tar -xzf source-code.tar.gz

    - name: Download generated native bridges
      uses: actions/download-artifact@v7
      with:
        name: native-bridges
        path: TotalCrossSDK/build/generated/native-bridges

    - name: Download prepared native dependencies
      uses: actions/download-artifact@v7
      with:
        name: prepared-native-dependencies

    - name: Extract prepared native dependencies
      shell: bash
      run: tar -xzf depot-tools-native-dependencies.tar.gz

    - name: Export dependency overrides
      env:
        SQLITE3_RELEASE_TAG_OVERRIDE: ${{ secrets.SQLITE3_RELEASE_TAG }}
        SQLITE3_GITHUB_REPO_OVERRIDE: ${{ secrets.SQLITE3_GITHUB_REPO }}
        ZLIB_NG_RELEASE_TAG_OVERRIDE: ${{ secrets.ZLIB_NG_RELEASE_TAG }}
        ZLIB_NG_GITHUB_REPO_OVERRIDE: ${{ secrets.ZLIB_NG_GITHUB_REPO }}
        LIBPNG_RELEASE_TAG_OVERRIDE: ${{ secrets.LIBPNG_RELEASE_TAG }}
        LIBPNG_GITHUB_REPO_OVERRIDE: ${{ secrets.LIBPNG_GITHUB_REPO }}
        MBEDTLS_RELEASE_TAG_OVERRIDE: ${{ secrets.MBEDTLS_RELEASE_TAG }}
        MBEDTLS_GITHUB_REPO_OVERRIDE: ${{ secrets.MBEDTLS_GITHUB_REPO }}
        LIBJPEG_TURBO_RELEASE_TAG_OVERRIDE: ${{ secrets.LIBJPEG_TURBO_RELEASE_TAG }}
        LIBJPEG_TURBO_GITHUB_REPO_OVERRIDE: ${{ secrets.LIBJPEG_TURBO_GITHUB_REPO }}
        SKIA_RELEASE_TAG_OVERRIDE: ${{ secrets.SKIA_RELEASE_TAG }}
        SKIA_GITHUB_REPO_OVERRIDE: ${{ secrets.SKIA_GITHUB_REPO }}
      run: |
        for name in \
          SQLITE3_RELEASE_TAG SQLITE3_GITHUB_REPO \
          ZLIB_NG_RELEASE_TAG ZLIB_NG_GITHUB_REPO \
          LIBPNG_RELEASE_TAG LIBPNG_GITHUB_REPO \
          MBEDTLS_RELEASE_TAG MBEDTLS_GITHUB_REPO \
          LIBJPEG_TURBO_RELEASE_TAG LIBJPEG_TURBO_GITHUB_REPO \
          SKIA_RELEASE_TAG SKIA_GITHUB_REPO
        do
          value_name="${name}_OVERRIDE"
          if [ -n "${!value_name:-}" ]; then
            printf '%s=%s\n' "$name" "${!value_name}" >> "$GITHUB_ENV"
          fi
        done

    - name: Cache C/C++ compilation
      uses: actions/cache@v5
      with:
        path: .ccache
        key: ccache-${{ matrix.project }}-${{ hashFiles('TotalCrossVM/CMakeLists.txt', 'TotalCrossVM/src/**/*.c', 'TotalCrossVM/src/**/*.cc', 'TotalCrossVM/src/**/*.cpp', 'TotalCrossVM/src/**/*.h', 'TotalCrossVM/src/**/*.hpp', 'TotalCrossVM/modules/**/*.cmake', 'TotalCrossVM/third_party/**/*.c', 'TotalCrossVM/third_party/**/*.cc', 'TotalCrossVM/third_party/**/*.cpp', 'TotalCrossVM/third_party/**/*.h', 'TotalCrossVM/third_party/**/*.hpp', 'TotalCrossVM/third_party/**/CMakeLists.txt', 'TotalCrossVM/third_party/**/*.cmake') }}
        restore-keys: |
          ccache-${{ matrix.project }}-

    - name: Allow multiarch
      if: ${{ matrix.use_qemu }}
      run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

    - name: Build VM & Launcher
      run: |
        mkdir -p build .ccache
        DOCKER_ENV_ARGS=(
          -e CCACHE_DIR=/ccache
          -e CCACHE_BASEDIR=/sources
          -e CCACHE_COMPRESS=true
          -e CCACHE_MAXSIZE=1G
          -e SQLITE3_GITHUB_TOKEN
          -e ZLIB_NG_GITHUB_TOKEN
          -e LIBPNG_GITHUB_TOKEN
          -e MBEDTLS_GITHUB_TOKEN
          -e LIBJPEG_TURBO_GITHUB_TOKEN
        )
        for env_name in \
          SQLITE3_RELEASE_TAG SQLITE3_GITHUB_REPO \
          ZLIB_NG_RELEASE_TAG ZLIB_NG_GITHUB_REPO \
          LIBPNG_RELEASE_TAG LIBPNG_GITHUB_REPO \
          MBEDTLS_RELEASE_TAG MBEDTLS_GITHUB_REPO \
          LIBJPEG_TURBO_RELEASE_TAG LIBJPEG_TURBO_GITHUB_REPO \
          SKIA_RELEASE_TAG SKIA_GITHUB_REPO
        do
          if [ -n "${!env_name:-}" ]; then
            DOCKER_ENV_ARGS+=(-e "$env_name")
          fi
        done
        docker run --platform ${{ matrix.docker_platform }} \
          "${DOCKER_ENV_ARGS[@]}" \
          -v ${PWD}/build:/build \
          -v ${PWD}/.ccache:/ccache \
          -v ${PWD}:/sources \
          -t totalcross/${{ matrix.project }}:v1.0.7 bash -lc '
          set -e
          cmake --version
          if command -v ccache >/dev/null; then
            ccache --zero-stats || true
            CMAKE_CCACHE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          else
            echo "::warning::ccache is not installed in this Docker image; building without compiler cache"
            CMAKE_CCACHE_ARGS=""
          fi
          cmake /sources/TotalCrossVM -DCMAKE_BUILD_TYPE=Release ${{ matrix.project == 'linux-arm32v7' && '-DPNG_ARM_NEON_OPT=0' || '' }} ${{ inputs.image-string-linux-diagnostic && '-DCMAKE_C_FLAGS=-DTC_IMAGE_PNG_DIAGNOSTIC' || '' }} ${CMAKE_CCACHE_ARGS} -G Ninja &&
          ninja
          if command -v ccache >/dev/null; then
            ccache --show-stats || true
          fi
        '

    - name: Fix Docker-owned files
      if: ${{ always() }}
      run: |
        sudo chown -R "$USER:$USER" \
          build \
          .ccache \
          TotalCrossVM/deps/totalcross-depot-tools/skia/local \
          TotalCrossVM/deps/totalcross-depot-tools/zlib-ng/local \
          TotalCrossVM/deps/totalcross-depot-tools/minizip-ng/local \
          TotalCrossVM/deps/totalcross-depot-tools/libpng/local \
          TotalCrossVM/deps/totalcross-depot-tools/libjpeg-turbo/local \
          TotalCrossVM/deps/totalcross-depot-tools/sqlite3/local \
          TotalCrossVM/deps/totalcross-depot-tools/mbedtls/local \
          TotalCrossVM/deps/totalcross-depot-tools/axtls/local

    - name: Upload Linux build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.project }}
        path: |
          build
          build-provenance.json

  build-linux-arm32v7-cross:
    name: Build `linux-arm32v7-cross`
    # Temporarily disabled; remove this condition to re-enable the cross build.
    if: ${{ false }}
    needs: [checkout-source, prepare-native-dependencies, generate-native-bridges]
    runs-on: ubuntu-22.04

    steps:
    - name: Download source code
      uses: actions/download-artifact@v7
      with:
        name: source-code

    - name: Extract source code
      run: tar -xzf source-code.tar.gz

    - name: Download generated native bridges
      uses: actions/download-artifact@v7
      with:
        name: native-bridges
        path: TotalCrossSDK/build/generated/native-bridges

    - name: Download prepared native dependencies
      uses: actions/download-artifact@v7
      with:
        name: prepared-native-dependencies

    - name: Extract prepared native dependencies
      shell: bash
      run: tar -xzf depot-tools-native-dependencies.tar.gz

    - name: Install cross toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          curl \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          git \
          ninja-build \
          rsync

    - name: Build VM & Launcher
      run: |
        cmake TotalCrossVM \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=${PWD}/TotalCrossVM/cmake/toolchains/linux-arm32v7.cmake \
          -DPNG_ARM_NEON_OPT=0 \
          -G Ninja
        ninja

  build-windows:
    if: ${{ needs.checkout-source.outputs.scope == 'full' && !inputs.image-string-linux-diagnostic && !inputs.image-string-linux-baseline-comparison }}
    name: Build `windows`
    needs: [checkout-source, prepare-native-dependencies, generate-native-bridges]
    runs-on: windows-2022

    steps:
    - name: Download source code
      uses: actions/download-artifact@v7
      with:
        name: source-code

    - name: Extract source code
      shell: bash
      run: tar -xzf source-code.tar.gz

    - name: Download generated native bridges
      uses: actions/download-artifact@v7
      with:
        name: native-bridges
        path: TotalCrossSDK/build/generated/native-bridges

    - name: Download prepared native dependencies
      uses: actions/download-artifact@v7
      with:
        name: prepared-native-dependencies

    - name: Extract prepared native dependencies
      shell: bash
      run: tar -xzf depot-tools-native-dependencies.tar.gz

    - name: Export dependency overrides
      shell: bash
      env:
        SQLITE3_RELEASE_TAG_OVERRIDE: ${{ secrets.SQLITE3_RELEASE_TAG }}
        SQLITE3_GITHUB_REPO_OVERRIDE: ${{ secrets.SQLITE3_GITHUB_REPO }}
        ZLIB_NG_RELEASE_TAG_OVERRIDE: ${{ secrets.ZLIB_NG_RELEASE_TAG }}
        ZLIB_NG_GITHUB_REPO_OVERRIDE: ${{ secrets.ZLIB_NG_GITHUB_REPO }}
        LIBPNG_RELEASE_TAG_OVERRIDE: ${{ secrets.LIBPNG_RELEASE_TAG }}
        LIBPNG_GITHUB_REPO_OVERRIDE: ${{ secrets.LIBPNG_GITHUB_REPO }}
        MBEDTLS_RELEASE_TAG_OVERRIDE: ${{ secrets.MBEDTLS_RELEASE_TAG }}
        MBEDTLS_GITHUB_REPO_OVERRIDE: ${{ secrets.MBEDTLS_GITHUB_REPO }}
        LIBJPEG_TURBO_RELEASE_TAG_OVERRIDE: ${{ secrets.LIBJPEG_TURBO_RELEASE_TAG }}
        LIBJPEG_TURBO_GITHUB_REPO_OVERRIDE: ${{ secrets.LIBJPEG_TURBO_GITHUB_REPO }}
        SKIA_RELEASE_TAG_OVERRIDE: ${{ secrets.SKIA_RELEASE_TAG }}
        SKIA_GITHUB_REPO_OVERRIDE: ${{ secrets.SKIA_GITHUB_REPO }}
      run: |
        for name in \
          SQLITE3_RELEASE_TAG SQLITE3_GITHUB_REPO \
          ZLIB_NG_RELEASE_TAG ZLIB_NG_GITHUB_REPO \
          LIBPNG_RELEASE_TAG LIBPNG_GITHUB_REPO \
          MBEDTLS_RELEASE_TAG MBEDTLS_GITHUB_REPO \
          LIBJPEG_TURBO_RELEASE_TAG LIBJPEG_TURBO_GITHUB_REPO \
          SKIA_RELEASE_TAG SKIA_GITHUB_REPO
        do
          value_name="${name}_OVERRIDE"
          if [ -n "${!value_name:-}" ]; then
            printf '%s=%s\n' "$name" "${!value_name}" >> "$GITHUB_ENV"
          fi
        done

    - name: Build VM
      shell: cmd
      env:
        IMAGE_STRING_SMOKE: ${{ inputs.image-string-smoke }}
      run: |
        mkdir TotalCrossVM\vc2022
        pushd TotalCrossVM\vc2022
        if "%IMAGE_STRING_SMOKE%"=="true" (
          cmake ..\ -G"Visual Studio 17 2022" -A x64
          findstr /C:"<Platform>x64</Platform>" tcvm.vcxproj >NUL || exit /b 1
        ) else (
          cmake ..\ -G"Visual Studio 17 2022" -A Win32
        )
        findstr /C:"<RuntimeLibrary>MultiThreaded</RuntimeLibrary>" tcvm.vcxproj >NUL || exit /b 1
        findstr /C:"<RuntimeLibrary>MultiThreadedDebug</RuntimeLibrary>" tcvm.vcxproj >NUL || exit /b 1
        cmake --build . --config Release
        popd

    - name: Upload Windows build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows
        path: |
          TotalCrossVM/vc2022/Release/*.dll
          TotalCrossVM/vc2022/Release/*.exe
          build-provenance.json

  build-windows-native-legacy:
    if: ${{ needs.checkout-source.outputs.scope == 'full' && !inputs.image-string-smoke && !inputs.image-string-linux-diagnostic && !inputs.image-string-linux-baseline-comparison }}
    name: Build `windows-native-legacy`
    needs: [checkout-source, prepare-native-dependencies, generate-native-bridges]
    runs-on: windows-2022

    steps:
    - name: Download source code
      uses: actions/download-artifact@v7
      with:
        name: source-code

    - name: Extract source code
      shell: bash
      run: tar -xzf source-code.tar.gz

    - name: Download generated native bridges
      uses: actions/download-artifact@v7
      with:
        name: native-bridges
        path: TotalCrossSDK/build/generated/native-bridges

    - name: Download prepared native dependencies
      uses: actions/download-artifact@v7
      with:
        name: prepared-native-dependencies

    - name: Extract prepared native dependencies
      shell: bash
      run: tar -xzf depot-tools-native-dependencies.tar.gz

    - name: Export SQLite SEE override
      shell: bash
      env:
        SQLITE3_RELEASE_TAG_OVERRIDE: ${{ secrets.SQLITE3_RELEASE_TAG }}
        SQLITE3_GITHUB_REPO_OVERRIDE: ${{ secrets.SQLITE3_GITHUB_REPO }}
      run: |
        if [ -n "${SQLITE3_RELEASE_TAG_OVERRIDE:-}" ]; then
          printf 'SQLITE3_RELEASE_TAG=%s\n' "$SQLITE3_RELEASE_TAG_OVERRIDE" >> "$GITHUB_ENV"
        fi
        if [ -n "${SQLITE3_GITHUB_REPO_OVERRIDE:-}" ]; then
