      run: brew install xcbeautify

    - name: Install iOS signing assets
      if: ${{ inputs.signed-ios }}
      env:
        IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      run: |
        set -euo pipefail

        if [ -z "$IOS_CERTIFICATE_BASE64" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_PROVISION_PROFILE_BASE64" ] || [ -z "$IOS_KEYCHAIN_PASSWORD" ]; then
          echo "::error::Missing iOS signing secrets. Configure IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISION_PROFILE_BASE64, and IOS_KEYCHAIN_PASSWORD."
          exit 1
        fi

        certificate_path="${RUNNER_TEMP}/ios-signing-certificate.p12"
        profile_path="${RUNNER_TEMP}/TotalCross_VM.mobileprovision"
        profile_plist_path="${RUNNER_TEMP}/TotalCross_VM.plist"
        keychain_path="${RUNNER_TEMP}/ios-signing.keychain-db"

        printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
        printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 -D > "$profile_path"

        security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"
        security set-keychain-settings -lut 21600 "$keychain_path"
        security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"
        security import "$certificate_path" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
        security list-keychain -d user -s "$keychain_path"
        security default-keychain -s "$keychain_path"
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"

        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        security cms -D -i "$profile_path" > "$profile_plist_path"
        profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist_path")"
        profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist_path")"
        profile_team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist_path")"
        profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist_path")"

        if [[ "$profile_app_id" != *.com.totalcross.vm && "$profile_app_id" != *.com.totalcross.* ]]; then
          echo "::error::The installed iOS provisioning profile is for '${profile_app_id}', but this build requires com.totalcross.vm or a matching wildcard profile."
          exit 1
        fi

        cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
        {
          echo "IOS_PROVISION_PROFILE_SPECIFIER=${profile_name}"
          echo "IOS_PROVISION_PROFILE_UUID=${profile_uuid}"
          echo "IOS_TEAM_ID=${profile_team_id}"
        } >> "$GITHUB_ENV"

        echo "Installed iOS provisioning profile '${profile_name}' (${profile_uuid}) for team '${profile_team_id}' and app id '${profile_app_id}'."

    - name: Generate and patch Xcode project
      working-directory: TotalCrossVM/xcode
      run: |
        cmake ../ \
          -GXcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_OSX_ARCHITECTURES=arm64
        ruby -pi -e "gsub(\"config.build_settings['ARCHS[sdk=iphonesimulator*]'] = 'x86_64'\", \"config.build_settings['ARCHS[sdk=iphonesimulator*]'] = 'arm64'\")" Podfile
        pod install
        /usr/libexec/PlistBuddy -c "Add :DisableBuildSystemDeprecationDiagnostic bool" TotalCross.xcworkspace/xcshareddata/WorkspaceSettings.xcsettings || true
        /usr/libexec/PlistBuddy -c "Set :DisableBuildSystemDeprecationDiagnostic true" TotalCross.xcworkspace/xcshareddata/WorkspaceSettings.xcsettings
        ruby ../../scripts/fix-ios-xcode-dependencies.rb TCVM.xcodeproj/project.pbxproj

    - name: Build iOS archive for device
      working-directory: TotalCrossVM/xcode
      env:
        SIGN_IOS: ${{ inputs.signed-ios }}
      run: |
        set -o pipefail
        mkdir -p build/logs

        signing_args=()
        if [ "$SIGN_IOS" = "true" ]; then
          signing_args=(
            DEVELOPMENT_TEAM="${IOS_TEAM_ID}"
            PROVISIONING_PROFILE_SPECIFIER="${IOS_PROVISION_PROFILE_SPECIFIER}"
            teamID="${IOS_TEAM_ID}"
          )
        else
          signing_args=(
            CODE_SIGNING_ALLOWED=NO
          )
        fi

        xcodebuild \
          -workspace TotalCross.xcworkspace \
          -scheme TotalCross \
          BUILD_DIR=${PWD} \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath build/TotalCross.xcarchive \
          -resultBundlePath build/logs/TotalCross.xcresult \
          __DIAGNOSE_INVALID_DEPLOYMENT_TARGET_AS_ERROR=NO \
          "${signing_args[@]}" \
          archive \
          2>&1 | tee build/logs/xcodebuild-raw.log | xcbeautify

    - name: Export signed iOS IPA
      if: ${{ inputs.signed-ios }}
      working-directory: TotalCrossVM/xcode
      run: |
        set -o pipefail
        /usr/libexec/PlistBuddy -c "Set :teamID ${IOS_TEAM_ID}" ExportOptions.plist
        /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.totalcross.vm ${IOS_PROVISION_PROFILE_SPECIFIER}" ExportOptions.plist
        xcodebuild \
          -exportArchive \
          -archivePath build/TotalCross.xcarchive \
          -exportPath build/TotalCross.ipa \
          -exportOptionsPlist ExportOptions.plist \
          2>&1 | tee build/logs/xcodebuild-export-raw.log | xcbeautify

    - name: Upload iOS xcodebuild diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ios-xcodebuild-diagnostics
        path: |
          TotalCrossVM/xcode/build/logs/xcodebuild-raw.log
          TotalCrossVM/xcode/build/logs/xcodebuild-export-raw.log
          TotalCrossVM/xcode/build/logs/TotalCross.xcresult
        if-no-files-found: warn

    - name: Pack iOS artifacts
      env:
        SIGN_IOS: ${{ inputs.signed-ios }}
      run: |
        if [ "$SIGN_IOS" = "true" ]; then
          tar -czf ios.tar.gz -C TotalCrossVM/xcode/build TotalCross.xcarchive TotalCross.ipa
        else
          tar -czf ios.tar.gz -C TotalCrossVM/xcode/build TotalCross.xcarchive
        fi

    - name: Upload iOS build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ios
        path: |
          ios.tar.gz
          build-provenance.json

  build-linux-png-baseline:
    if: ${{ inputs.image-string-linux-baseline-comparison }}
    name: Build master Linux PNG baseline
    needs: [prepare-native-dependencies]
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout feature source and history
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download prepared native dependencies
      uses: actions/download-artifact@v7
      with:
        name: prepared-native-dependencies

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Create isolated master baseline with startup fix
      id: baseline
      shell: bash
      run: |
        set -euo pipefail
        baseline="${RUNNER_TEMP}/totalcross-linux-png-baseline"
        git worktree add --detach "${baseline}" 61034a7562e7fa43df076dcc38bcd48128605395
        git -C "${baseline}" -c user.name='GitHub Actions' -c user.email='actions@github.com' cherry-pick 153f9fae5
        test "$(sed -n '/^[^#[:space:]]/p' "${baseline}/TotalCrossVM/deps/totalcross-depot-tools.ref" | head -1)" = 0fd3c98727c87a441bc9c8d2c8dd2b731ef0861a
        test "$(git show "${GITHUB_SHA}:TotalCrossVM/deps/totalcross-depot-tools.ref" | sed -n '/^[^#[:space:]]/p' | head -1)" = 0fd3c98727c87a441bc9c8d2c8dd2b731ef0861a
        test "$(git -C "${baseline}" rev-parse HEAD^)" = 61034a7562e7fa43df076dcc38bcd48128605395
        test "$(git -C "${baseline}" diff --name-only 61034a7562e7fa43df076dcc38bcd48128605395..HEAD)" = TotalCrossVM/src/init/posix/startup_c.h
        test -z "$(git -C "${baseline}" status --short --untracked-files=no)"
        printf 'path=%s\ncommit=%s\ntree=%s\n' \
          "${baseline}" \
          "$(git -C "${baseline}" rev-parse HEAD)" \
          "$(git -C "${baseline}" rev-parse HEAD^{tree})" >> "${GITHUB_OUTPUT}"

    - name: Extract matching native dependencies
      env:
        BASELINE: ${{ steps.baseline.outputs.path }}
      run: |
        set -euo pipefail
        tar -xzf depot-tools-native-dependencies.tar.gz -C "${BASELINE}"
        python3 - "${BASELINE}" <<'PY'
        import json, sys
        from pathlib import Path
        manifest=Path(sys.argv[1])/"TotalCrossVM/deps/totalcross-depot-tools/prepared-native-dependencies.json"
        data=json.loads(manifest.read_text())
        assert data["depot_tools_revision"] == "0fd3c98727c87a441bc9c8d2c8dd2b731ef0861a"
        tags={item.get("release_tag") for item in data["dependencies"]}
        expected={"libpng-1.6.48-r3","zlib-ng-2.1.6-r3"}
        assert expected <= tags, f"native tags differ: {sorted(tags)}"
        print(f"depotTools={data['depot_tools_revision']} libpng=libpng-1.6.48-r3 zlib-ng=zlib-ng-2.1.6-r3")
        for item in data["dependencies"]:
            if item.get("release_tag") in expected:
                print(f"dependency={item['dependency']} tag={item['release_tag']} asset={item['asset']} sha256={item['sha256']}")
        PY

    - name: Record baseline provenance
      env:
        BASELINE: ${{ steps.baseline.outputs.path }}
      run: |
        set -euo pipefail
        cd "${BASELINE}"
        python3 scripts/provenance/validate-compatibility.py --repository-root .
        python3 - <<'PY'
        import json, os, subprocess, sys
        from pathlib import Path
        sys.path.insert(0, str(Path("scripts/provenance").resolve()))
        from compatibility_contract import read_compatibility_contract
        Path("build-provenance.json").write_text(json.dumps({
            "schemaVersion": 1,
            "repository": os.environ["GITHUB_REPOSITORY"],
            "source": {
                "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                "dirty": False,
            },
            "producer": {
                "kind": "github-actions",
                "runId": os.environ["GITHUB_RUN_ID"],
                "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
            },
            "compatibility": read_compatibility_contract(Path("config/artifact-compatibility.properties")),
        }, sort_keys=True) + "\n", encoding="utf-8")
        PY
        python3 scripts/provenance/build-identity.py --repository-root . \
          --update-manifest build-provenance.json --format id

    - name: Build baseline SDK and native bridges
      env:
        BASELINE: ${{ steps.baseline.outputs.path }}
      run: |
        set -euo pipefail
        cd "${BASELINE}/scripts"
        ./package-sdk.sh
        cd "${BASELINE}/TotalCrossSDK"
        ./gradlew-agent generateNativeBridgeSources

    - name: Build baseline Linux VM in the canonical container
      env:
        BASELINE: ${{ steps.baseline.outputs.path }}
      run: |
        set -euo pipefail
        mkdir -p "${BASELINE}/build"
        docker run --rm \
          -v "${BASELINE}/build:/build" \
          -v "${BASELINE}:/sources" \
          -t totalcross/linux-amd64:v1.0.7 bash -lc '
            set -e
            cmake /sources/TotalCrossVM -DCMAKE_BUILD_TYPE=Release -G Ninja
            ninja
          '

    - name: Pack baseline build artifacts
      env:
        BASELINE: ${{ steps.baseline.outputs.path }}
      run: tar -czf "${RUNNER_TEMP}/linux-png-baseline-build.tar.gz" -C "${BASELINE}" build build-provenance.json

    - name: Upload baseline build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-png-baseline-build
        path: ${{ runner.temp }}/linux-png-baseline-build.tar.gz
        if-no-files-found: error
        retention-days: 1

  image-string-linux-baseline-comparison:
    if: ${{ inputs.image-string-linux-baseline-comparison }}
    name: Compare deployed PNG decode on Linux x64
    needs: [build-linux, build-sdk, prepare-native-dependencies, build-linux-png-baseline]
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout feature source
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download feature SDK
      uses: actions/download-artifact@v7
      with:
        name: sdk-build
        path: feature-sdk

    - name: Download feature Linux VM
      uses: actions/download-artifact@v7
      with:
        name: linux-amd64
        path: feature-native

    - name: Download comparison app and baseline artifacts
      uses: actions/download-artifact@v7
      with:
        pattern: linux-png-*
        path: comparison-artifacts
        merge-multiple: false

    - name: Download prepared native dependencies
      uses: actions/download-artifact@v7
      with:
        name: prepared-native-dependencies
        path: prepared-dependencies

    - name: Set up Linux runtime and JDK
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends --yes libegl1 libgles2 xvfb

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Record pinned dependency manifest
      run: |
        set -euo pipefail
        tar -xzf prepared-dependencies/depot-tools-native-dependencies.tar.gz -C .
        cp TotalCrossVM/deps/totalcross-depot-tools/prepared-native-dependencies.json dependency-manifest.json
        python3 - <<'PY'
        import json
        from pathlib import Path
        data=json.loads(Path("dependency-manifest.json").read_text())
        assert data["depot_tools_revision"] == "0fd3c98727c87a441bc9c8d2c8dd2b731ef0861a"
        tags={item.get("release_tag") for item in data["dependencies"]}
        expected={"libpng-1.6.48-r3","zlib-ng-2.1.6-r3"}
        assert expected <= tags, f"native tags differ: {sorted(tags)}"
        print(f"depotTools={data['depot_tools_revision']} libpng=libpng-1.6.48-r3 zlib-ng=zlib-ng-2.1.6-r3")
        for item in data["dependencies"]:
            if item.get("release_tag") in expected:
                print(f"dependency={item['dependency']} tag={item['release_tag']} asset={item['asset']} sha256={item['sha256']}")
        PY

    - name: Prepare feature and baseline SDK/VM pairs
      env:
        EXPECTED_FEATURE_COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        mkdir -p feature baseline
        tar -xzf feature-sdk/sdk-build.tar.gz
        mkdir -p feature/build/TotalCross/dist/vm/linux feature/build/TotalCross/etc/launchers/linux
        native_manifest="$(find feature-native -type f -name build-provenance.json -print -quit)"
        cp "$(find feature-native -type f -name libtcvm.so -print -quit)" feature/build/TotalCross/dist/vm/linux/libtcvm.so
        cp "$(find feature-native -type f -name Launcher -print -quit)" feature/build/TotalCross/etc/launchers/linux/Launcher
        cp "${native_manifest}" feature/native-provenance.json
        tar -xzf comparison-artifacts/linux-png-baseline-build/linux-png-baseline-build.tar.gz -C baseline
        if grep -q 'CMAKE_C_FLAGS:STRING=-DTC_IMAGE_PNG_DIAGNOSTIC' feature-native/build/CMakeCache.txt baseline/build/CMakeCache.txt; then
          echo 'comparison build unexpectedly enabled TC_IMAGE_PNG_DIAGNOSTIC' >&2
          exit 1
        fi
        baseline_commit="$(python3 -c 'import json;print(json.load(open("baseline/build-provenance.json"))["source"]["commit"])')"
        test "$(git -C . rev-parse HEAD)" = "${EXPECTED_FEATURE_COMMIT}"
        test "$(python3 -c 'import json;print(json.load(open("build-provenance.json"))["source"]["commit"])')" = "${EXPECTED_FEATURE_COMMIT}"
        FEATURE_NATIVE_MANIFEST=feature/native-provenance.json EXPECTED_FEATURE_COMMIT="${EXPECTED_FEATURE_COMMIT}" python3 - <<'PY'
        import json, os
        from pathlib import Path
        sdk=json.loads(Path("build-provenance.json").read_text())
        native=json.loads(Path(os.environ["FEATURE_NATIVE_MANIFEST"]).read_text())
        assert sdk["source"]["commit"] == os.environ["EXPECTED_FEATURE_COMMIT"] and not sdk["source"]["dirty"]
        assert native["source"]["commit"] == os.environ["EXPECTED_FEATURE_COMMIT"] and not native["source"]["dirty"]
        assert sdk["source"]["tree"] == native["source"]["tree"]
        assert sdk["build"]["id"] == native["build"]["id"]
        baseline=json.loads(Path("baseline/build-provenance.json").read_text())
        print(f"featureCommit={sdk['source']['commit']} featureTree={sdk['source']['tree']} featureBuildId={sdk['build']['id']}")
        print(f"baselineCommit={baseline['source']['commit']} baselineTree={baseline['source']['tree']} baselineBuildId={baseline['build']['id']}")
        PY
        mkdir -p baseline/build/TotalCross/dist/vm/linux baseline/build/TotalCross/etc/launchers/linux
        cp baseline/build/libtcvm.so baseline/build/TotalCross/dist/vm/linux/libtcvm.so
        cp baseline/build/Launcher baseline/build/TotalCross/etc/launchers/linux/Launcher

    - name: Verify fixtures and deploy both smoke variants
      id: compare
      env:
        TOTALCROSS3_HOME: ${{ github.workspace }}/build/TotalCross
      shell: bash
      run: |
        set -euo pipefail
        app="${GITHUB_WORKSPACE}/comparison-artifacts/linux-png-comparison-app/LinuxPngDecodeComparisonApp.jar"
        test -f "${app}"
        sha256sum TotalCrossSDK/src/smokeTest/resources/image-abi/tiny.png TotalCrossSDK/src/smokeTest/resources/image-abi/lena512.jpg
        unzip -p "${app}" comparison/tiny.png | sha256sum | grep -q '958903b3f880fbf626fa8fbba8f69856a989f5930531984be9585aac08a5aba6'
        unzip -p "${app}" comparison/control.jpg | sha256sum | grep -q 'df0035534c5c12d024763dce5f515023ad7e16139f4278b360291b2f0261fb51'
        mkdir -p "${RUNNER_TEMP}/png-compare/feature" "${RUNNER_TEMP}/png-compare/baseline"
        run_variant() {
          label="$1" sdkroot="$2" home="$3"
          work="${RUNNER_TEMP}/png-compare/${label}"
          cp "${app}" "${work}/"
          (
            cd "${work}"
            if ! TOTALCROSS3_HOME="${home}" java -cp "${sdkroot}/dist/totalcross-sdk.jar:${sdkroot}/dist/libs/*" tc.Deploy LinuxPngDecodeComparisonApp.jar -linux > deploy.log 2>&1; then
              printf 'deploy=failed\n' > smoke.log
              return 0
            fi
            cd install/linux
            set +e
            TOTALCROSS3_HOME="${home}" timeout 120s xvfb-run -a ./LinuxPngDecodeComparisonApp > "${work}/smoke.log" 2>&1
            status=$?
            set -e
            printf 'exitCode=%s\n' "${status}" >> "${work}/smoke.log"
            return 0
          )
        }
        run_variant feature "${GITHUB_WORKSPACE}/build/TotalCross" "${GITHUB_WORKSPACE}/build/TotalCross"
        run_variant baseline "${GITHUB_WORKSPACE}/baseline/build/TotalCross" "${GITHUB_WORKSPACE}/baseline/build/TotalCross"
        python3 - <<'PY'
        import json, re
        import os
        from pathlib import Path
        names=("png-file","png-bytes","jpeg-file","jpeg-bytes")
        results={}
        for variant in ("baseline","feature"):
            output=Path(os.environ["RUNNER_TEMP"])/"png-compare"/variant/"smoke.log"
            text=output.read_text(errors="replace") if output.exists() else ""
            results[variant]={name: (re.search(rf"case={name},[^\n]*decode=(true|false)", text).group(1)=="true") if re.search(rf"case={name},[^\n]*decode=(true|false)", text) else None for name in names}
        b=results["baseline"]; f=results["feature"]
        if all(b[k] is False and f[k] is False for k in ("png-file","png-bytes")) and all(b[k] is True and f[k] is True for k in ("jpeg-file","jpeg-bytes")):
            classification="preexisting-linux-png-decode-failure"
        elif any(b[k] is True and f[k] is False for k in ("png-file","png-bytes")):
            classification="feature-introduced-linux-png-decode-failure"
        elif all(b[k] is True and f[k] is True for k in ("png-file","png-bytes")):
            classification="png-decode-passes-on-both"
        else:
            classification="inconclusive"
        (Path(os.environ["RUNNER_TEMP"])/"png-compare"/"result.json").write_text(json.dumps({"classification":classification,"baseline":b,"feature":f},indent=2)+"\n")
        with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:
            output.write(f"classification={classification}\n")
        print(json.dumps({"classification":classification,"baseline":b,"feature":f},sort_keys=True))
        PY

    - name: Run isolated standalone libpng and ABI probes
      if: ${{ steps.compare.outputs.classification == 'preexisting-linux-png-decode-failure' }}
      shell: bash
      run: |
        set -euo pipefail
        tar -xzf prepared-dependencies/depot-tools-native-dependencies.tar.gz -C .
        feature_cache=feature-native/build/CMakeCache.txt
        baseline_cache=baseline/build/CMakeCache.txt
        png_library="$(sed -n 's/^PNG_LIBRARY:FILEPATH=\/sources\///p' "${feature_cache}")"
        zlib_library="$(sed -n 's/^ZLIB_LIBRARY:FILEPATH=\/sources\///p' "${feature_cache}")"
        png_include="$(sed -n 's/^PNG_INCLUDE_DIR:PATH=\/sources\///p' "${feature_cache}")"
        zlib_include="$(sed -n 's/^ZLIB_INCLUDE_DIR:PATH=\/sources\///p' "${feature_cache}")"
        test -n "${png_library}" && test -n "${zlib_library}"
        test "$(sed -n 's/^PNG_LIBRARY:FILEPATH=\/sources\///p' "${baseline_cache}")" = "${png_library}"
        test "$(sed -n 's/^ZLIB_LIBRARY:FILEPATH=\/sources\///p' "${baseline_cache}")" = "${zlib_library}"
        test -f "${png_library}" && test -f "${zlib_library}"
        mkdir -p "${RUNNER_TEMP}/png-compare/probe"
        cp "${RUNNER_TEMP}/png-compare/feature/install/linux/comparison-png.png" comparison-feed.png
        {
          grep -E '^(CMAKE_BUILD_TYPE:STRING|CMAKE_C_FLAGS:STRING|PNG_DIR:PATH|PNG_INCLUDE_DIR:PATH|PNG_LIBRARY:FILEPATH|ZLIB_DIR:PATH|ZLIB_INCLUDE_DIR:PATH|ZLIB_LIBRARY:FILEPATH)=' "${feature_cache}"
          printf 'PNG_LIBRARY=%s\nZLIB_LIBRARY=%s\n' "${png_library}" "${zlib_library}"
          sha256sum "${png_library}" "${zlib_library}"
          file feature/build/TotalCross/dist/vm/linux/libtcvm.so baseline/build/TotalCross/dist/vm/linux/libtcvm.so
          readelf -h feature/build/TotalCross/dist/vm/linux/libtcvm.so | rg 'Class:|Machine:'
          readelf -h baseline/build/TotalCross/dist/vm/linux/libtcvm.so | rg 'Class:|Machine:'
        } > "${RUNNER_TEMP}/png-compare/probe/inputs.txt"
        cc -I"${png_include}" -I"${zlib_include}" scripts/image-string-linux-comparison/abi_probe.c \
          -o "${RUNNER_TEMP}/png-compare/probe/abi-probe"
        "${RUNNER_TEMP}/png-compare/probe/abi-probe" > "${RUNNER_TEMP}/png-compare/probe/abi.txt"
        cc -I"${png_include}" -I"${zlib_include}" scripts/image-string-linux-comparison/standalone_png_decode.c \
          "${png_library}" "${zlib_library}" -lm -o "${RUNNER_TEMP}/png-compare/probe/standalone-png-decode"
        set +e
        "${RUNNER_TEMP}/png-compare/probe/standalone-png-decode" comparison-feed.png \
          > "${RUNNER_TEMP}/png-compare/probe/standalone.stdout" \
          2> "${RUNNER_TEMP}/png-compare/probe/standalone.stderr"
        probe_status=$?
        set -e
        printf 'exitCode=%s\n' "${probe_status}" >> "${RUNNER_TEMP}/png-compare/probe/inputs.txt"
        nm -A --defined-only "${png_library}" "${zlib_library}" | rg ' (png_create_read_struct|inflateEnd|adler32)$' \
          > "${RUNNER_TEMP}/png-compare/probe/symbols.txt" || true
        printf 'sha256=' >> "${RUNNER_TEMP}/png-compare/probe/inputs.txt"
        sha256sum comparison-feed.png >> "${RUNNER_TEMP}/png-compare/probe/inputs.txt"

    - name: Upload Linux baseline comparison evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: linux-png-baseline-comparison-evidence
        path: ${{ runner.temp }}/png-compare
        if-no-files-found: warn
        retention-days: 30

  image-string-smoke-linux:
    if: ${{ inputs.image-string-smoke || inputs.image-string-linux-diagnostic }}
    name: Deployed Image(String) smoke on Linux x64
    needs: [build-linux, build-sdk]
    runs-on: ubuntu-22.04

    steps:
    - name: Download SDK build
      uses: actions/download-artifact@v7
      with:
        name: sdk-build
        path: sdk

    - name: Download Linux VM build
      uses: actions/download-artifact@v7
      with:
        name: linux-amd64
        path: native

    - name: Download smoke app
      uses: actions/download-artifact@v7
      with:
        name: image-string-smoke-app
        path: smoke-app

    - name: Install Linux VM runtime libraries
      run: |
        sudo apt-get update -qq
        sudo apt-get install -qq --no-install-recommends --yes libegl1 libgles2

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Prepare matching SDK and VM
      env:
        EXPECTED_COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        tar -xzf sdk/sdk-build.tar.gz
        native_manifest="$(find native -type f -name build-provenance.json -print -quit)"
        test -n "${native_manifest}"
        mkdir -p build/TotalCross/dist/vm/linux build/TotalCross/etc/launchers/linux
        vm="$(find native -type f -name libtcvm.so -print -quit)"
        launcher="$(find native -type f -name Launcher -print -quit)"
        test -n "${vm}" && test -n "${launcher}"
        cp "${vm}" build/TotalCross/dist/vm/linux/libtcvm.so
        cp "${launcher}" build/TotalCross/etc/launchers/linux/Launcher
        NATIVE_MANIFEST="${native_manifest}" EXPECTED_COMMIT="${EXPECTED_COMMIT}" python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        sdk = json.loads(Path("build-provenance.json").read_text())
        native = json.loads(Path(os.environ["NATIVE_MANIFEST"]).read_text())
        for label, value in (("SDK", sdk), ("Linux VM", native)):
            source = value["source"]
            if source["commit"] != os.environ["EXPECTED_COMMIT"] or source["dirty"]:
                raise SystemExit(f"{label} provenance does not match the workflow commit")
        if sdk["source"]["tree"] != native["source"]["tree"] or sdk["build"]["id"] != native["build"]["id"]:
            raise SystemExit("SDK and Linux VM provenance differ")
        print(f"sourceCommit={sdk['source']['commit']}")
        print(f"sourceTree={sdk['source']['tree']}")
        print(f"buildId={sdk['build']['id']}")
        PY

    - name: Deploy and execute Linux smoke app
      env:
        TOTALCROSS3_HOME: ${{ github.workspace }}/build/TotalCross
      run: |
        set -euo pipefail
        smoke_dir="${RUNNER_TEMP}/image-string-linux"
        mkdir -p "${smoke_dir}"
        cp smoke-app/EncodedImageSourceSmokeApp.jar "${smoke_dir}/"
        sdk="${GITHUB_WORKSPACE}/build/TotalCross/dist"
        source_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source"]["tree"])' build-provenance.json)"
        build_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["build"]["id"])' build-provenance.json)"
        cd "${smoke_dir}"
        java -cp "${sdk}/totalcross-sdk.jar:${sdk}/libs/*" tc.Deploy EncodedImageSourceSmokeApp.jar -linux > deploy.log 2>&1
        cd "${smoke_dir}/install/linux"
        set +e
        timeout 120s xvfb-run -a ./EncodedImageSourceSmokeApp > "${smoke_dir}/smoke.log" 2>&1
        smoke_status=$?
        set -e
        result_line="$(grep 'fixture=EncodedImageSourceSmokeApp' "${smoke_dir}/smoke.log" | tail -1 || true)"
        printf '%s\n' "${result_line}"
        {
          printf 'sourceCommit=%s\nharnessCommit=%s\n' '${{ github.sha }}' '${{ github.sha }}'
          printf 'sourceTree=%s\nbuildId=%s\n' "${source_tree}" "${build_id}"
          printf 'platform=linux-x64\nexitCode=%s\n' "${smoke_status}"
          printf '%s\n' "${result_line}"
        } > "${smoke_dir}/smoke-result.txt"
        test "${smoke_status}" -eq 0
        printf '%s' "${result_line}" | grep -q 'overallPass=true'
        printf '%s' "${result_line}" | grep -q 'runtimeFixturesNotPackaged=true'

    - name: Capture Linux smoke backtrace
      if: failure()
      run: |
        set -euo pipefail
        smoke_dir="${RUNNER_TEMP}/image-string-linux"
        cd "${smoke_dir}/install/linux"
        if ! command -v gdb >/dev/null 2>&1; then
          sudo apt-get install -qq --no-install-recommends --yes gdb
        fi
        cat > "${smoke_dir}/diagnostic.gdb" <<'GDB'
        set pagination off
        set breakpoint pending on
        break __realpath_chk
        commands
          silent
          printf "realpath path=%s output_capacity=%lu\n", (char*)$rdi, (unsigned long)$rdx
          continue
        end
        run
        bt full 30
        GDB
        set +e
        timeout 120s xvfb-run -a gdb --batch --quiet --return-child-result \
          -x "${smoke_dir}/diagnostic.gdb" \
          --args ./EncodedImageSourceSmokeApp > "${smoke_dir}/diagnostic.log" 2>&1
        gdb_status=$?
        set -e
        printf 'gdbExitCode=%s\n' "${gdb_status}" >> "${smoke_dir}/diagnostic.log"

    - name: Upload Linux smoke evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: image-string-smoke-linux-x64
        path: |
          ${{ runner.temp }}/image-string-linux/deploy.log
          ${{ runner.temp }}/image-string-linux/smoke.log
          ${{ runner.temp }}/image-string-linux/smoke-result.txt
          ${{ runner.temp }}/image-string-linux/diagnostic.log
        if-no-files-found: warn
        retention-days: 30

  image-string-smoke-windows:
    if: ${{ inputs.image-string-smoke }}
    name: Deployed Image(String) smoke on Windows x64
    needs: [build-windows, build-sdk]
    runs-on: windows-2022

    steps:
    - name: Download SDK build
      uses: actions/download-artifact@v7
      with:
        name: sdk-build
        path: sdk

    - name: Download Windows VM build
      uses: actions/download-artifact@v7
      with:
        name: windows
        path: native

    - name: Download smoke app
      uses: actions/download-artifact@v7
      with:
        name: image-string-smoke-app
        path: smoke-app

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Deploy and execute Windows smoke app
      shell: pwsh
      env:
        EXPECTED_COMMIT: ${{ github.sha }}
      run: |
        $ErrorActionPreference = 'Stop'
        $smokeDir = Join-Path $env:RUNNER_TEMP 'image-string-windows'
        New-Item -ItemType Directory -Force $smokeDir | Out-Null
        tar -xzf sdk/sdk-build.tar.gz
        $nativeManifest = Get-ChildItem native -Recurse -Filter build-provenance.json | Select-Object -First 1
        if (-not $nativeManifest) { throw 'Windows VM provenance is missing' }
        $sdkIdentity = Get-Content build-provenance.json -Raw | ConvertFrom-Json
        $vmIdentity = Get-Content $nativeManifest.FullName -Raw | ConvertFrom-Json
        if ($sdkIdentity.source.commit -ne $env:EXPECTED_COMMIT -or $vmIdentity.source.commit -ne $env:EXPECTED_COMMIT -or $sdkIdentity.source.dirty -or $vmIdentity.source.dirty) { throw 'SDK/Windows VM provenance does not match this workflow commit' }
        if ($sdkIdentity.source.tree -ne $vmIdentity.source.tree -or $sdkIdentity.build.id -ne $vmIdentity.build.id) { throw 'SDK and Windows VM provenance differ' }
        "sourceCommit=$($sdkIdentity.source.commit)" | Set-Content (Join-Path $smokeDir 'smoke-result.txt')
        "harnessCommit=$env:EXPECTED_COMMIT" | Add-Content (Join-Path $smokeDir 'smoke-result.txt')
        "sourceTree=$($sdkIdentity.source.tree)" | Add-Content (Join-Path $smokeDir 'smoke-result.txt')
        "buildId=$($sdkIdentity.build.id)" | Add-Content (Join-Path $smokeDir 'smoke-result.txt')
        New-Item -ItemType Directory -Force build/TotalCross/dist/vm/win32, build/TotalCross/etc/launchers/win32 | Out-Null
        $vm = Get-ChildItem native -Recurse -Filter tcvm.dll | Select-Object -First 1
        $launcher = Get-ChildItem native -Recurse -Filter Launcher.exe | Select-Object -First 1
        if (-not $vm -or -not $launcher) { throw 'Windows VM or launcher artifact is missing' }
        Copy-Item $vm.FullName build/TotalCross/dist/vm/win32/tcvm.dll
        Copy-Item $launcher.FullName build/TotalCross/etc/launchers/win32/Launcher.exe
        $env:TOTALCROSS3_HOME = "$pwd/build/TotalCross"
        Copy-Item smoke-app/EncodedImageSourceSmokeApp.jar $smokeDir
        $sdkDist = Join-Path $env:TOTALCROSS3_HOME 'dist'
        $classPath = "$sdkDist/totalcross-sdk.jar;$sdkDist/libs/*"
        Push-Location $smokeDir
        try {
          java -cp $classPath tc.Deploy EncodedImageSourceSmokeApp.jar -win32 *> (Join-Path $smokeDir 'deploy.log')
          if ($LASTEXITCODE -ne 0) { throw "Windows smoke deployment failed: $LASTEXITCODE" }
          Push-Location (Join-Path $smokeDir 'install/win32')
          try {
            & .\EncodedImageSourceSmokeApp.exe *> (Join-Path $smokeDir 'smoke.log')
            $smokeStatus = $LASTEXITCODE
            "platform=windows-x64" | Add-Content (Join-Path $smokeDir 'smoke-result.txt')
            "exitCode=$smokeStatus" | Add-Content (Join-Path $smokeDir 'smoke-result.txt')
            $resultLine = Select-String -Path (Join-Path $smokeDir 'smoke.log') -Pattern 'fixture=EncodedImageSourceSmokeApp' | Select-Object -Last 1
            if ($resultLine) {
              $resultLine.Line | Add-Content (Join-Path $smokeDir 'smoke-result.txt')
              if ($resultLine.Line -notmatch 'overallPass=true' -or $resultLine.Line -notmatch 'runtimeFixturesNotPackaged=true') { throw 'Windows smoke assertions failed' }
            } else {
              'resultLineCaptured=false (GUI launcher exposes the smoke result through its process exit code)' | Add-Content (Join-Path $smokeDir 'smoke-result.txt')
            }
            if ($smokeStatus -ne 0) { throw "Windows smoke failed: exitCode=$smokeStatus" }
          } finally {
            Pop-Location
          }
        } finally {
          Pop-Location
        }

    - name: Upload Windows smoke evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: image-string-smoke-windows-x64
        path: |
          ${{ runner.temp }}/image-string-windows/**
        if-no-files-found: warn
        retention-days: 30

  image-string-smoke-android:
    if: ${{ inputs.image-string-smoke }}
    name: Deployed Image(String) smoke on Android 15 emulator
    needs: [build-android, build-sdk]
    runs-on: ubuntu-24.04

    steps:
    - name: Download SDK build
      uses: actions/download-artifact@v7
      with:
        name: sdk-build
        path: sdk

    - name: Download Android VM build
      uses: actions/download-artifact@v7
      with:
        name: android
        path: native

    - name: Download smoke app
      uses: actions/download-artifact@v7
      with:
        name: image-string-smoke-app
        path: smoke-app

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: ''

    - name: Enable and verify Android KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
        test -c /dev/kvm || { echo 'Android smoke infrastructure failure: /dev/kvm is missing'; exit 1; }
        test -r /dev/kvm && test -w /dev/kvm || { echo 'Android smoke infrastructure failure: runner cannot read and write /dev/kvm'; exit 1; }
        ls -l /dev/kvm
        if command -v emulator >/dev/null 2>&1; then emulator -accel-check; fi

    - name: Deploy Android smoke APK
      env:
        EXPECTED_COMMIT: ${{ github.sha }}
        TOTALCROSS3_HOME: ${{ github.workspace }}/build/TotalCross
      run: |
        set -euo pipefail
        tar -xzf sdk/sdk-build.tar.gz
        native_manifest="$(find native -type f -name build-provenance.json -print -quit)"
        test -n "${native_manifest}"
        NATIVE_MANIFEST="${native_manifest}" EXPECTED_COMMIT="${EXPECTED_COMMIT}" python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        sdk = json.loads(Path("build-provenance.json").read_text())
        native = json.loads(Path(os.environ["NATIVE_MANIFEST"]).read_text())
        for label, value in (("SDK", sdk), ("Android VM", native)):
            source = value["source"]
            if source["commit"] != os.environ["EXPECTED_COMMIT"] or source["dirty"]:
                raise SystemExit(f"{label} provenance does not match the workflow commit")
        if sdk["source"]["tree"] != native["source"]["tree"] or sdk["build"]["id"] != native["build"]["id"]:
            raise SystemExit("SDK and Android VM provenance differ")
        print(f"sourceCommit={sdk['source']['commit']}")
        print(f"sourceTree={sdk['source']['tree']}")
        print(f"buildId={sdk['build']['id']}")
        PY
        mkdir -p build/TotalCross/dist/vm/android
        aab="$(find native -type f -name TotalCross.aab -print -quit)"
        test -n "${aab}"
        cp "${aab}" build/TotalCross/dist/vm/android/TotalCross.aab
        mkdir -p "${RUNNER_TEMP}/image-string-android"
        cp smoke-app/EncodedImageSourceSmokeApp.jar "${RUNNER_TEMP}/image-string-android/"
        cat > "${RUNNER_TEMP}/image-string-android/run-smoke.sh" <<'SH'
        #!/bin/sh
        set -eu
        work="${RUNNER_TEMP}/image-string-android"
        apk="$(find "${work}/install/android" -maxdepth 1 -type f -name '*.apk' -print -quit)"
        test -n "${apk}"
        aapt="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt -print | sort -V | tail -1)"
        test -n "${aapt}"
        badging="$("${aapt}" dump badging "${apk}")"
        package_name="$(printf '%s\n' "${badging}" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
        activity_name="$(printf '%s\n' "${badging}" | sed -n "s/^launchable-activity: name='\([^']*\)'.*/\1/p" | head -1)"
        test -n "${package_name}"
        test -n "${activity_name}"
        case "${activity_name}" in
          .*) activity_name="${package_name}${activity_name}" ;;
        esac
        component="${package_name}/${activity_name}"
        printf 'apkPackage=%s\napkLaunchActivity=%s\nactivityComponent=%s\n' \
          "${package_name}" "${activity_name}" "${component}" \
          > "${work}/apk-component.txt"
        adb logcat -c
        adb install -r "${apk}"
        adb shell pm path "${package_name}" > "${work}/package-check.txt"
        grep -q '^package:' "${work}/package-check.txt"
        launch_status=0
        set +e
        launch_output="$(adb shell am start -W -n "${component}" 2>&1)"
        launch_status=$?
        set -e
        printf '%s\n' "${launch_output}" > "${work}/activity-launch.txt"
        if [ "${launch_status}" -ne 0 ] || ! printf '%s\n' "${launch_output}" | grep -q 'Status: ok'; then
          adb shell dumpsys activity activities > "${work}/activity-state.txt" 2>&1 || true
          adb shell ps -A > "${work}/process-state.txt" 2>&1 || true
          adb logcat -d -v threadtime > "${work}/android-logcat.txt" 2>&1 || true
          printf 'android app activity failed to start: component=%s status=%s\n' \
            "${component}" "${launch_status}" > "${work}/smoke-result.txt"
          exit 1
        fi
        poll_status=0
        timeout 45s sh -c '
          work="$1"
          while :; do
            adb logcat -d -v raw > "${work}/android-logcat.txt"
            if grep -q "fixture=EncodedImageSourceSmokeApp" "${work}/android-logcat.txt"; then
              grep "fixture=EncodedImageSourceSmokeApp" "${work}/android-logcat.txt" | tail -1 \
                > "${work}/result-line.txt"
              exit 0
            fi
            sleep 1
          done
        ' sh "${work}" || poll_status=$?
        result_line=""
        if [ -f "${work}/result-line.txt" ]; then
          IFS= read -r result_line < "${work}/result-line.txt" || true
        fi
        if [ -z "${result_line}" ]; then
          adb shell dumpsys activity activities > "${work}/activity-state.txt" 2>&1 || true
          adb shell ps -A > "${work}/process-state.txt" 2>&1 || true
          adb logcat -d -v threadtime > "${work}/android-logcat.txt" 2>&1 || true
        fi
        source_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source"]["tree"])' "${GITHUB_WORKSPACE}/build-provenance.json")"
        build_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["build"]["id"])' "${GITHUB_WORKSPACE}/build-provenance.json")"
        printf '%s\n' "${result_line}"
        {
          printf 'sourceCommit=%s\nharnessCommit=%s\nplatform=android-api-35\nlaunchStatus=%s\npollExitCode=%s\n' \
            "${GITHUB_SHA}" "${GITHUB_SHA}" "${launch_status}" "${poll_status}"
          printf 'sourceTree=%s\nbuildId=%s\n' "${source_tree}" "${build_id}"
          printf 'activityComponent=%s\n' "${component}"
          printf '%s\n' "${result_line}"
        } > "${work}/smoke-result.txt"
        test "${poll_status}" -eq 0
        test -n "${result_line}"
        printf '%s' "${result_line}" | grep -q 'overallPass=true'
        printf '%s' "${result_line}" | grep -q 'runtimeFixturesNotPackaged=true'
        printf '%s' "${result_line}" | grep -q 'deviceFilesystemPathSupported=true'
        SH
        cd "${RUNNER_TEMP}/image-string-android"
        sdk="${GITHUB_WORKSPACE}/build/TotalCross/dist"
        java -cp "${sdk}/totalcross-sdk.jar:${sdk}/libs/*" tc.Deploy EncodedImageSourceSmokeApp.jar -android > deploy.log 2>&1
        find "${RUNNER_TEMP}/image-string-android/install/android" -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .

    - name: Run Android 15 emulator smoke
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        emulator-boot-timeout: 900
        target: google_apis
        arch: x86_64
        profile: pixel_6
        emulator-options: -no-window -no-audio -no-boot-anim
        script: |
          sh "${RUNNER_TEMP}/image-string-android/run-smoke.sh"

    - name: Upload Android smoke evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: image-string-smoke-android-api-35
        path: |
          ${{ runner.temp }}/image-string-android/deploy.log
          ${{ runner.temp }}/image-string-android/android-logcat.txt
          ${{ runner.temp }}/image-string-android/smoke-result.txt
          ${{ runner.temp }}/image-string-android/activity-launch.txt
          ${{ runner.temp }}/image-string-android/activity-state.txt
          ${{ runner.temp }}/image-string-android/process-state.txt
          ${{ runner.temp }}/image-string-android/apk-component.txt
          ${{ runner.temp }}/image-string-android/package-check.txt
        if-no-files-found: warn
        retention-days: 30
