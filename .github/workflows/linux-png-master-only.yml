name: Linux PNG master-only verification

on:
  push:
    branches:
      - test/linux-png-master-only
    paths:
      - .github/workflows/linux-png-master-only.yml

permissions:
  contents: read
  actions: read

jobs:
  png-master:
    name: Test PNG Image(File) on unmodified master VM
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Download master SDK (run 45137788982)
        uses: actions/download-artifact@v7
        with:
          name: sdk-build
          run-id: 45137788982
          repository: TotalCross/totalcross
          github-token: ${{ github.token }}
          path: sdk

      - name: Download matching master Linux x64 VM
        uses: actions/download-artifact@v7
        with:
          name: linux-amd64
          run-id: 45137788982
          repository: TotalCross/totalcross
          github-token: ${{ github.token }}
          path: native

      - name: Download immutable PNG/JPEG comparison application
        uses: actions/download-artifact@v7
        with:
          name: linux-png-comparison-app
          run-id: 45720318038
          repository: TotalCross/totalcross
          github-token: ${{ github.token }}
          path: app

      - name: Install Linux native runtime requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends --yes \
            libegl1 libgles2 libfontconfig1 libfreetype6 xvfb

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify artifact identity and fixture integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          tar -xzf sdk/sdk-build.tar.gz
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          expected = "61034a7562e7fa43df076dcc38bcd48128605395"
          sdk = json.loads(Path("build-provenance.json").read_text())
          vm = json.loads(Path("native/build-provenance.json").read_text())
          for label, obj in (("sdk", sdk), ("vm", vm)):
              assert obj["source"]["commit"] == expected and not obj["source"]["dirty"], label
          assert sdk["source"]["tree"] == vm["source"]["tree"], "source trees differ"
          assert sdk["build"]["id"] == vm["build"]["id"], "build identities differ"
          p = Path("app/LinuxPngDecodeComparisonApp.jar")
          assert p.exists(), "comparison JAR absent"
          with zipfile.ZipFile(p) as archive:
              samples = {
                  "comparison/tiny.png": "958903b3f880fbf626fa8fbba8f69856a989f5930531984be9585aac08a5aba6",
                  "comparison/control.jpg": "df0035534c5c12d024763dce5f515023ad7e16139f4278b360291b2f0261fb51",
              }
              for name, digest in samples.items():
                  actual = hashlib.sha256(archive.read(name)).hexdigest()
                  assert actual == digest, (name, actual)
          Path("results/provenance.txt").write_text(
              f"masterCommit={expected}\n"
              f"sourceTree={sdk['source']['tree']}\n"
              f"buildId={sdk['build']['id']}\n"
              f"fixtureHashesVerified=true\n"
              "nativeVmUnmodified=true\n"
          )
          print(Path("results/provenance.txt").read_text())
          PY
          mkdir -p build/TotalCross/dist/vm/linux build/TotalCross/etc/launchers/linux
          cp native/build/libtcvm.so build/TotalCross/dist/vm/linux/libtcvm.so
          cp native/build/Launcher build/TotalCross/etc/launchers/linux/Launcher
          chmod +x build/TotalCross/etc/launchers/linux/Launcher

      - name: Compile isolated master realpath startup workaround
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          cat > results/master-realpath-compat.c <<'C'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <stddef.h>
          #include <stdlib.h>
          #include <string.h>
          /*
           * Test-only interposition of glibc's _FORTIFY_SOURCE realpath check.
           * The master VM calls __realpath_chk with a 1024-byte buffer, which
           * fails when glibc PATH_MAX is larger. Keep the master VM unchanged.
           * This shim changes only path canonicalization, not image decoding,
           * PNG or zlib symbol binding.
           */
          char *__realpath_chk(const char *path, char *output, size_t capacity) {
              char *resolved = realpath(path, NULL);
              size_t length;
              if (!resolved) return NULL;
              if (!output) return resolved;
              length = strlen(resolved) + 1;
              if (length > capacity) {
                  free(resolved);
                  errno = ENAMETOOLONG;
                  return NULL;
              }
              memcpy(output, resolved, length);
              free(resolved);
              return output;
          }
          C
          cc -shared -fPIC -Wall -Wextra -Werror \
            -o results/master-realpath-compat.so results/master-realpath-compat.c
          echo "testOnlyRealpathShim=true" >> results/provenance.txt

      - name: Deploy and run Image(File) / Image(byte[]) PNG comparison on master
        shell: bash
        env:
          TOTALCROSS3_HOME: ${{ github.workspace }}/build/TotalCross
        run: |
          set -euo pipefail
          mkdir -p results/smoke
          cp app/LinuxPngDecodeComparisonApp.jar results/smoke/
          (
            cd results/smoke
            java -cp "${TOTALCROSS3_HOME}/dist/totalcross-sdk.jar:${TOTALCROSS3_HOME}/dist/libs/*" \
              tc.Deploy LinuxPngDecodeComparisonApp.jar -linux > ../deploy.log 2>&1
          )
          test -f results/smoke/install/linux/LinuxPngDecodeComparisonApp
          shim="${GITHUB_WORKSPACE}/results/master-realpath-compat.so"
          (
            cd results/smoke/install/linux
            set +e
            timeout 75s env LD_PRELOAD="${shim}" \
              xvfb-run -a ./LinuxPngDecodeComparisonApp > "${GITHUB_WORKSPACE}/results/smoke.log" 2>&1
            rc=$?
            set -e
            printf 'runtimeExit=%s\n' "${rc}" > "${GITHUB_WORKSPACE}/results/runtime-status.txt"
            # Functional findings are evaluated separately; a PNG failure is
            # the sought regression evidence, not an infrastructure failure.
            exit 0
          )
          cat results/smoke.log || true
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          log = Path("results/smoke.log").read_text(errors="replace")
          fields = {}
          for key in ("png-file", "png-bytes", "jpeg-file", "jpeg-bytes"):
              match = re.search(r"case=" + re.escape(key) + r",[^\n]*decode=(true|false)", log)
              fields[key] = match.group(1) if match else "missing"
          status = Path("results/runtime-status.txt").read_text().strip()
          if fields["png-file"] == "false" and fields["jpeg-file"] == "true" and fields["jpeg-bytes"] == "true":
              verdict = "CONFIRMED_PREEXISTING_MASTER_PNG_FAILURE"
          elif fields["png-file"] == "true" and fields["png-bytes"] == "true":
              verdict = "MASTER_PNG_PASSED"
          else:
              verdict = "INCONCLUSIVE"
          summary = dict(master="61034a7562e7fa43df076dcc38bcd48128605395",
                         verdict=verdict, cases=fields, status=status)
          Path("results/verdict.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary))
          PY

      - name: Upload full diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-png-master-only-evidence
          path: results/
          retention-days: 10
          if-no-files-found: warn
