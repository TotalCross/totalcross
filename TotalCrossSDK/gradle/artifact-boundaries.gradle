def artifactOutput = layout.buildDirectory.dir('libs')

def registerBoundaryJar = { String taskName, String archiveName, Closure content ->
    tasks.register(taskName, Jar) {
        archiveBaseName = archiveName
        destinationDirectory = artifactOutput
        includeEmptyDirs = false
        from(sourceSets.main.output, content)
    }
}

registerBoundaryJar('totalcrossApiJar', 'totalcross-api') {
    include 'totalcross/lang/**', 'totalcross/sys/**', 'totalcross/util/**', 'totalcross/ui/**'
    include 'jdkcompat/**'
    exclude 'totalcross/preview/**', 'totalcross/Launcher*', 'totalcross/PreviewRunner*'
    exclude 'totalcross/sys/VmStandardOutputStream.class'
    exclude 'totalcross/sys/runtime/RuntimeConfigurationMetadata*.class'
    exclude 'totalcross/sys/runtime/RuntimeConfigurationStartup*.class'
    exclude 'totalcross/sys/runtime/RuntimeConfigurationFeatureBridge*.class'
    exclude 'totalcross/sys/runtime/ImageRuntimeConfigurationMetadata*.class'
    exclude 'totalcross/sys/runtime/ImageRuntimeConfigurationStartup*.class'
    exclude 'totalcross/sys/runtime/ImageRuntimePolicy*.class'
    exclude 'totalcross/sys/runtime/ImageRuntimeOptions*.class'
    exclude 'totalcross/sys/runtime/RuntimeRuleResolver*.class'
    exclude 'totalcross/sys/runtime/ResolvedRuntimeConfiguration*.class'
    exclude 'totalcross/sys/RuntimeDiagnosticsFeatureBridge*.class'
    exclude 'totalcross/ui/image/ImageRasterFeatureBridge*.class'
    exclude 'totalcross/ui/DisplayPreparationBatch*.class'
    exclude 'totalcross/ui/DisplayPreparationContext*.class'
    exclude 'totalcross/ui/image/ImagePreparationFeatureBridge*.class'
    exclude 'totalcross/ui/image/ImagePreparationMetrics*.class'
    exclude 'totalcross/ui/image/ImagePreparationRequest*.class'
    exclude 'totalcross/ui/image/ImagePreparationScheduler*.class'
    exclude 'totalcross/ui/image/PreparedImageResult*.class'
    exclude 'totalcross/ui/image/ImageCompactStorageCapabilityBridge*.class'
    exclude 'totalcross/ui/image/ImageDrawingFeatureBridge*.class'
    exclude '**/*4D.class', '**/*4D$*.class', '**/*4D*.class'
}

registerBoundaryJar('totalcrossRuntimeJavaJar', 'totalcross-runtime-java') {
    include 'totalcross/**', 'jdkcompat/**'
    exclude 'totalcross/preview/**', 'tc/**', 'totalcross/LauncherApplet*'
    exclude 'totalcross/Launcher.class', 'totalcross/Launcher$*.class',
            'totalcross/TotalCrossApplication.class'
}

registerBoundaryJar('totalcrossConverterJar', 'totalcross-converter') {
    include 'tc/tools/converter/**'
}

registerBoundaryJar('totalcrossDeployerJar', 'totalcross-deployer') {
    include 'tc/Deploy.class', 'tc/Deploy$*.class', 'tc/tools/deployer/**'
    include 'tc/tools/JarClassPathLoader.class', 'tc/tools/RegisterSDK.class'
    exclude 'tc/tools/converter/**'
}

registerBoundaryJar('totalcrossSimulatorJar', 'totalcross-simulator') {
    include 'totalcross/Launcher.class', 'totalcross/Launcher$*.class'
    include 'totalcross/TotalCrossApplication.class'
    include 'tc/simulator/**', 'tc/preview/**'
}

tasks.register('artifactContentTest', Test) {
    group = 'verification'
    description = 'Verifies narrow artifact package boundaries.'
    dependsOn 'dist', jar, totalcrossApiJar, totalcrossRuntimeJavaJar, totalcrossConverterJar,
            totalcrossDeployerJar, totalcrossSimulatorJar
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'totalcross.artifact.dir', artifactOutput.get().asFile.absolutePath
    systemProperty 'totalcross.aggregate.sdk.jar', project.file('dist/totalcross-sdk.jar').absolutePath
    useJUnitPlatform {
        includeTags 'artifact-boundary'
    }
}
