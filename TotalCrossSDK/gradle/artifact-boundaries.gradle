def artifactOutput = layout.buildDirectory.dir('libs')

def registerBoundaryJar = { String taskName, String archiveName, Closure content ->
    tasks.register(taskName, Jar) {
        archiveBaseName = archiveName
        destinationDirectory = artifactOutput
        includeEmptyDirs = false
        from(sourceSets.main.output, content)
    }
}

registerBoundaryJar('totalcrossApiJar', 'totalcross-api') {
    include 'totalcross/lang/**', 'totalcross/sys/**', 'totalcross/util/**', 'totalcross/ui/**'
    include 'jdkcompat/**'
    exclude 'totalcross/preview/**', 'totalcross/Launcher*', 'totalcross/PreviewRunner*'
}

registerBoundaryJar('totalcrossRuntimeJavaJar', 'totalcross-runtime-java') {
    include 'totalcross/**', 'jdkcompat/**'
    exclude 'totalcross/preview/**', 'tc/**', 'totalcross/LauncherApplet*'
}

registerBoundaryJar('totalcrossConverterJar', 'totalcross-converter') {
    include 'tc/tools/converter/**'
}

registerBoundaryJar('totalcrossDeployerJar', 'totalcross-deployer') {
    include 'tc/Deploy.class', 'tc/Deploy$*.class', 'tc/tools/deployer/**'
    include 'tc/tools/JarClassPathLoader.class', 'tc/tools/RegisterSDK.class'
    exclude 'tc/tools/converter/**'
}

registerBoundaryJar('totalcrossSimulatorJar', 'totalcross-simulator') {
    include 'totalcross/Launcher.class', 'totalcross/Launcher$*.class'
    include 'tc/simulator/**', 'tc/preview/**'
}

tasks.register('artifactContentTest', Test) {
    group = 'verification'
    description = 'Verifies narrow artifact package boundaries.'
    dependsOn totalcrossApiJar, totalcrossRuntimeJavaJar, totalcrossConverterJar,
            totalcrossDeployerJar, totalcrossSimulatorJar
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'totalcross.artifact.dir', artifactOutput.get().asFile.absolutePath
    useJUnitPlatform {
        includeTags 'artifact-boundary'
    }
}
