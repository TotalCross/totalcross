task fetchSdkNativeRuntime {
    group = 'build setup'
    description = 'Fetches native runtime DLLs distributed with the SDK.'

    inputs.file(depotToolsFetchScript)
    inputs.file(depotToolsRefFile).optional()
    inputs.property('vcruntimeReleaseTag', optionalInput(vcruntimeReleaseTag))
    inputs.property('vcruntimeGithubRepo', optionalInput(vcruntimeGithubRepo))
    outputs.files(vcruntimeDll, vcruntimeManifest, vcruntimeNotice, vcruntimeInputsFingerprint)

    doLast {
        def reuseIssues = vcruntimeReadyIssues()
        if (reuseIssues.isEmpty()) {
            logger.lifecycle("Reusing prepared vcruntime windows/x86 from ${vcruntimeLocalDir}")
            return
        }

        logger.lifecycle(
            "Prepared vcruntime windows/x86 is unavailable or invalid (${reuseIssues.join('; ')}); fetching it."
        )
        runWithVisibleOutput(
            'Fetching totalcross-depot-tools metadata',
            ['bash', depotToolsFetchScript.absolutePath]
        )

        if (!vcruntimeFetchScript.isFile()) {
            throw GradleException("Could not find vcruntime fetch script at ${vcruntimeFetchScript}")
        }

        def fetchArgs = [
            'bash',
            vcruntimeFetchScript.absolutePath,
            '--platform', 'windows',
            '--arch', 'x86',
            '--github-token-env', 'VCRUNTIME_GITHUB_TOKEN'
        ]
        addOptionalArg(fetchArgs, '--release-tag', vcruntimeReleaseTag)
        addOptionalArg(fetchArgs, '--github-repo', vcruntimeGithubRepo)
        runWithVisibleOutput('Fetching vcruntime windows/x86', fetchArgs)

        def fetchedPayloadIssues = vcruntimePayloadIssues()
        if (!fetchedPayloadIssues.isEmpty()) {
            throw new GradleException(
                "Fetched vcruntime windows/x86 is invalid: ${fetchedPayloadIssues.join('; ')}"
            )
        }
        vcruntimeInputsFingerprint.setText(vcruntimeExpectedFingerprint + System.lineSeparator(), 'UTF-8')
    }
}

task copySdkDependencies(type: Copy, dependsOn: fetchSdkNativeRuntime) {
    doFirst {
        delete destinationDir
    }
    from({ configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') } })
    from(vcruntimeLocalDir) {
        include '*.dll'
    }
    into 'dist/libs'
}

task dist(dependsOn: [build, copySdkDependencies, 'sourcesJar', 'javadocJar']) {
    doLast {
        copy {
            from 'etc/fonts/TCFont.tcz'
            from 'build/libs/TCUI.tcz'
            from 'build/libs/tc.base.lang.tcz'
            from 'build/libs/tc.base.util.tcz'
            from 'build/libs/tc.base.misc.tcz'
            into 'dist/vm/'
        }

        copy {
            from jar.archiveFile
            into 'dist/'
            rename { String fileName ->
                fileName.replace('-' + project.version, '')
            }
        }
    }
}

// All smoke applications are normal Java sources under src/smokeTest/java.
// The built-in compileSmokeTestJava task compiles them once against the
// generated SDK. Compatibility tasks below stage only the package needed by
// each deploy scenario into its historical isolated working directory.
def smokeTestSdkJar = file('dist/totalcross-sdk.jar')
def smokeTestClassesDir = layout.buildDirectory.dir('classes/java/smokeTest')
def smokeTestResourcesDir = layout.buildDirectory.dir('resources/smokeTest')
def featureSmokeClassesDir = layout.buildDirectory.dir('feature-smoke/classes')
def lambdaLoweringFixesClassesDir = layout.buildDirectory.dir('lambda-lowering-fixes/classes')
def lambdaReturnTypesClassesDir = layout.buildDirectory.dir('lambda-return-types-regression/classes')
def axtlsProviderSmokeClassesDir = layout.buildDirectory.dir('axtls-provider-smoke/classes')

tasks.named('compileSmokeTestJava', JavaCompile) {
    destinationDirectory = smokeTestClassesDir
    options.encoding = 'UTF-8'
    options.release.set(17)

    doFirst {
        if (!smokeTestSdkJar.isFile()) {
            throw new GradleException('Run ./gradlew dist -x test before compiling the smoke tests.')
        }
    }
}
def logicalUiScalingSmokeClassesDir = layout.buildDirectory.dir('logical-ui-scaling-smoke/classes')
def logicalUiScalingSmokeSdkJar = file('dist/totalcross-sdk.jar')
def logicalUiScalingSmokeSources = fileTree('src/test/resources/logical-ui-scaling/danfe') {
	include '*.java'
}

tasks.named('processSmokeTestResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

