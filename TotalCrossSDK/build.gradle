    }
    from('src/main/resources/images/back3.jpg') {
        into 'image-abi'
        rename { 'back3.jpg' }
    }
    into imageAbiSmokeClassesDir

    // Keep the native result tied to the exact source revision used by this run.
    outputs.upToDateWhen { false }
    doLast {
        def commitFile = new File(imageAbiSmokeClassesDir.get().asFile, 'image-abi/commit.txt')
        commitFile.parentFile.mkdirs()
        def commit = providers.exec {
            commandLine 'git', 'rev-parse', 'HEAD'
        }.standardOutput.asText.get().trim()
        commitFile.setText(commit + System.lineSeparator(), 'UTF-8')
    }
}

