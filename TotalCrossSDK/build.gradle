apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin: 'me.champeau.gradle.japicmp'

apply from: file('gradle/artifact-boundaries.gradle')

version = '7.2.2'
group = 'com.totalcross'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

base {
    archivesName = 'totalcross-sdk'
}

// can't be used yet, enconding is a mess
compileJava.options.encoding = 'UTF-8'

javadoc {
    failOnError = false
    options.encoding = 'UTF-8'
}

configurations {
    obfuscatedArchive
}

wrapper {
    gradleVersion = '9.6.1'
    distributionType = Wrapper.DistributionType.ALL
}

sourceSets {
    main {
        java {
            exclude 'tc/RunSSLSocketTestApplication.java'
            exclude 'tc/SSLSocketTest.java'
            exclude 'totalcross/LauncherApplet.java'
            exclude 'tc/SSLSocketTest.java', 'tc/RunSSLSocketTestApplication.java'
        }
    }

    smokeTest {
        java {
            srcDir 'src/smokeTest/java'
        }
        resources {
            srcDir 'src/smokeTest/resources'
        }
    }
}

buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath 'net.sf.proguard:proguard-gradle:5.3.3'
        classpath 'me.champeau.gradle.japicmp:me.champeau.gradle.japicmp.gradle.plugin:0.4.6'
    }
}

repositories {
    maven {
        url = uri("http://maven.totalcross.com/artifactory/repo1")
        allowInsecureProtocol = true
    }
    mavenCentral()
}

dependencies {
    // https://mvnrepository.com/artifact/org.vafer/jdeb
    implementation('org.vafer:jdeb:1.14') {
        exclude group: 'org.bouncycastle'
    }
    // https://mvnrepository.com/artifact/org.bouncycastle/bcpkix-bcpkix-lts8on
    implementation("org.bouncycastle:bcpkix-lts8on:2.73.11")
    // https://mvnrepository.com/artifact/com.googlecode.plist/dd-plist
    implementation 'com.googlecode.plist:dd-plist:1.19'
    // https://mvnrepository.com/artifact/org.xerial/sqlite-jdbc
    implementation 'org.xerial:sqlite-jdbc:3.32.3.3'
    // https://mvnrepository.com/artifact/de.schlichtherle.truezip/truezip-file
    implementation 'de.schlichtherle.truezip:truezip-file:7.5.1'
    // https://mvnrepository.com/artifact/de.schlichtherle.truezip/truezip-driver-zip
    implementation('de.schlichtherle.truezip:truezip-driver-zip:7.5.1') {
        exclude group: 'org.bouncycastle'
    }
    // https://mvnrepository.com/artifact/commons-io/commons-io
    implementation 'commons-io:commons-io:2.2'

    // https://mvnrepository.com/artifact/org.ow2.asm/asm
    implementation 'org.ow2.asm:asm:5.2'
    // https://mvnrepository.com/artifact/org.ow2.asm/asm-tree
    implementation 'org.ow2.asm:asm-tree:5.2'

    // https://mvnrepository.com/artifact/net.harawata/appdirs
    implementation 'net.harawata:appdirs:1.2.0'
    // https://mvnrepository.com/artifact/net.java.dev.jna/jna-platform
    runtimeOnly 'net.java.dev.jna:jna-platform:4.2.2'

    // https://mvnrepository.com/artifact/net.coobird/thumbnailator
    implementation 'net.coobird:thumbnailator:0.4.20'

    // https://mvnrepository.com/artifact/junit/junit
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.7.0'

    smokeTestImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    smokeTestRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    smokeTestRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.7.0'

    implementation 'com.totalcross.annotations:totalcross-annotations:1.0.0'

    // Smoke tests deliberately compile against the generated SDK artifact rather
    // than against sourceSets.main.output, so they validate the distributable JAR.
    smokeTestImplementation files('dist/totalcross-sdk.jar')
}

def aggregateCompatibilityBaseline = providers.gradleProperty('aggregateCompatibilityBaseline')
tasks.register('aggregateCompatibilityCheck', me.champeau.gradle.japicmp.JapicmpTask) {
    dependsOn tasks.named('jar')
    if (aggregateCompatibilityBaseline.present) {
        oldClasspath.from(aggregateCompatibilityBaseline.get())
    }
    onlyIf {
        if (!aggregateCompatibilityBaseline.present) {
            logger.lifecycle('Skipping aggregateCompatibilityCheck: set -PaggregateCompatibilityBaseline=<old-sdk.jar> to compare releases')
            return false
        }
        true
    }
    newClasspath.from(tasks.named('jar'))
    onlyModified = true
    onlyBinaryIncompatibleModified = true
    failOnModification = providers.gradleProperty('aggregateCompatibilityStrict')
        .map { it.toBoolean() }.orElse(true).get()
    ignoreMissingClasses = true
    txtOutputFile = layout.buildDirectory.file('reports/aggregate-compatibility.txt').get().asFile
}

test {
    useJUnitPlatform()
    def awtHeadless = System.getProperty('java.awt.headless')
    if (awtHeadless != null) {
        systemProperty 'java.awt.headless', awtHeadless
    }
    // Anonymous telemetry is disabled until its external service is replaced.
    exclude '**/AnonymousUserDataTest.class'
    testLogging {
        exceptionFormat = 'full'
    }
    useJUnitPlatform {
        excludeTags 'artifact-boundary'
    }
}

jar {
    exclude 'totalcross/res/mp3/**', 'totalcross/chartypes.bin'
    from new File(project.rootDir, 'etc/fonts/TCFont.tcz')
    from new File(project.rootDir, 'etc/fonts/Material Icons.tcz')
    into("META-INF/maven/${project.group}/${base.archivesName.get()}") {
        from {
            generatePomFileForMavenCustomPublication
        }
        rename ".*", "pom.xml"
    }

    // collect all runtime dependencies shipped in dist/libs
    int i = 0
    String classpathVar = configurations.runtimeClasspath.collect { " libs/" + (i++ == 0 ? String.format("%-50s", it.getName()) : String.format("%-62s", it.getName())) }.join(" ")
    manifest {
        attributes('Main-Class': 'totalcross.Launcher')
        manifest {
            attributes(
                "Class-Path": classpathVar
            )
        }
    }
}

publishing {
    publications {
        mavenCustom(MavenPublication) {
            artifactId = 'totalcross-sdk'
            pom.packaging = 'jar'

            // workaround - maven-publish lists all dependencies as runtime regardless of the original scope
            pom.withXml {
                // use instead of 'asNode()' - workaround to avoid duplicating the dependencies node by getting index 0
                def dependenciesNode = asNode().getAt("dependencies")[0]

                dependenciesNode.dependencies.'*'.findAll() {
                    it.scope.text() == 'runtime' && project.configurations.implementation.allDependencies.find { dep ->
                        dep.name == it.artifactId.text()
                    }
                }.each { it.scope*.value = 'compile' }

                // manually add test dependencies because they are ignored by maven-publish
                configurations.testImplementation.dependencies.each {
                    def dependencyNode = dependenciesNode.appendNode('dependency')
                    dependencyNode.appendNode('groupId', it.group)
                    dependencyNode.appendNode('artifactId', it.name)
                    dependencyNode.appendNode('version', it.version)
                    dependencyNode.appendNode('scope', 'test')
                }
            }

            // kept as reference
            /*
            pom.withXml {
                asNode().appendNode('description',
                                    'A demonstration of maven POM customization')
            }
            */

            from components.java
        }
        mavenApi(MavenPublication) {
            artifactId = 'totalcross-api'
            artifact tasks.named('totalcrossApiJar')
        }
        mavenRuntimeJava(MavenPublication) {
            artifactId = 'totalcross-runtime-java'
            artifact tasks.named('totalcrossRuntimeJavaJar')
        }
        mavenConverter(MavenPublication) {
            artifactId = 'totalcross-converter'
            artifact tasks.named('totalcrossConverterJar')
        }
        mavenDeployer(MavenPublication) {
            artifactId = 'totalcross-deployer'
            artifact tasks.named('totalcrossDeployerJar')
        }
        mavenSimulator(MavenPublication) {
            artifactId = 'totalcross-simulator'
            artifact tasks.named('totalcrossSimulatorJar')
        }
    }
}

// we're not publishing yet
publishing {
    repositories {
        maven {
            // Use -PstagingRepo for an isolated release repository; keep the
            // historical build/repo destination for ordinary local builds.
            url = uri(project.findProperty('stagingRepo') ?: 'build/repo')
        }
    }
}

task signJar {
    doLast {
        try {
            ant.signjar(
                jar: jar.archiveFile.get().asFile,
                signedJar: jar.archiveFile.get().asFile,
                alias: 'tcandroidkey',
                storetype: "jks",
                keystore: "$System.env.TC_PATH_TO_KEY_STORE",
                storepass: "$System.env.TC_STORE_PASSWORD",
                keypass: "$System.env.TC_STORE_KEY",
                verbose: true,
                preservelastmodified: "true"
            )
        } catch (Exception e) {
            logger.warn("TC_PATH_TO_KEY_STORE or TC_STORE_PASSWORD or TC_STORE_KEY not defined! Jar won't be signed")
        }
    }
}

