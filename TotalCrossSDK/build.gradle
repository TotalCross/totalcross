tasks.register('runModernJavaFeatureSmoke', Exec) {
    group = 'verification'
    description = 'Runs the generated macOS aggregate modern Java feature smoke executable.'
    dependsOn 'deployModernJavaFeatureSmoke'
    ignoreExitValue = true
    def smokeOutput = new ByteArrayOutputStream()
    doFirst {
        def nativeRuntime = project.findProperty('tcvmDylib')
        if (nativeRuntime) {
            def nativeRuntimeFile = file(nativeRuntime)
            if (!nativeRuntimeFile.isFile()) {
                throw new GradleException("Native runtime not found: ${nativeRuntimeFile}")
            }
            copy {
                from nativeRuntimeFile
                into featureSmokeClassesDir.get().dir('install/macos').asFile
                rename { 'libtcvm.dylib' }
            }
        }
        commandLine featureSmokeClassesDir.get().file('install/macos/FeatureSmokeApp').asFile
        smokeOutput.reset()
        standardOutput = smokeOutput
        errorOutput = smokeOutput
    }
    workingDir featureSmokeClassesDir.map { it.dir('install/macos').asFile }
    doLast {
        String output = smokeOutput.toString('UTF-8')
        logger.lifecycle(output)
        int exitCode = executionResult.get().exitValue
        boolean predicatePass = output.contains('[PASS] Java 8 - Predicate default methods')
        boolean predicateFail = output.contains('[FAIL] Java 8 - Predicate default methods')
        boolean predicateNoSuchMethod = (
            output.contains('NoSuchMethodError') &&
            output.contains('java.util.function.Predicate')
        )
        boolean aborted = output.contains('Aborting program')
        if (exitCode != 0 || !predicatePass || predicateFail || predicateNoSuchMethod || aborted) {
            throw new GradleException('Modern Java feature smoke validation failed: exitCode=' + exitCode
                + ', predicatePass=' + predicatePass + ', predicateFail=' + predicateFail
                + ', predicateNoSuchMethod=' + predicateNoSuchMethod + ', aborted=' + aborted)
        }
    }
}

