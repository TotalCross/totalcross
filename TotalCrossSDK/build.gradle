tasks.register('compileLogicalUiScalingSmoke', JavaCompile) {
	group = 'verification'
	description = 'Compiles the logical UI scaling fixture against the generated SDK.'

	source logicalUiScalingSmokeSources
	classpath = files(logicalUiScalingSmokeSdkJar)
	destinationDirectory = logicalUiScalingSmokeClassesDir
	options.encoding = 'UTF-8'
	options.release.set(17)

	doFirst {
		if (!logicalUiScalingSmokeSdkJar.isFile()) {
			throw new GradleException('Run ./gradlew-agent dist -x test before compiling the logical UI scaling fixture.')
		}
	}
}

tasks.register('deployLogicalUiScalingSmokeMacOS', JavaExec) {
	group = 'verification'
	description = 'Deploys the logical UI scaling fixture for native macOS validation.'
	dependsOn 'copySdkDependencies', 'compileLogicalUiScalingSmoke'

	mainClass = 'tc.Deploy'
	classpath = files(logicalUiScalingSmokeSdkJar) + fileTree('dist/libs') {
		include '*.jar'
	}
	workingDir logicalUiScalingSmokeClassesDir.get().asFile
	args = [
		'danfe/fixture/DanfeScalingApp.class',
		'-macos'
	]
	doFirst {
		def launcher = project.findProperty('tcvmLauncher')
		if (launcher) {
			def launcherFile = file(launcher)
			if (!launcherFile.isFile()) {
				throw new GradleException("Native macOS launcher not found: ${launcherFile}")
			}
			copy {
				from launcherFile
				into file('etc/launchers/macos')
				rename { 'Launcher' }
			}
		}
		def nativeRuntime = project.findProperty('tcvmDylib')
		if (nativeRuntime) {
			def nativeRuntimeFile = file(nativeRuntime)
			if (!nativeRuntimeFile.isFile()) {
				throw new GradleException("Native runtime not found: ${nativeRuntimeFile}")
			}
			copy {
				from nativeRuntimeFile
				into file('dist/vm/macos')
				rename { 'libtcvm.dylib' }
			}
		}
	}
}

tasks.register('deployModernJavaFeatureSmoke', JavaExec) {
    group = 'verification'
    description = 'Deploys the aggregate modern Java feature smoke app with the generated SDK.'
    dependsOn 'copySdkDependencies', 'compileModernJavaFeatureSmoke'

    mainClass = 'tc.Deploy'
    classpath = files(smokeTestSdkJar) + fileTree('dist/libs') {
        include '*.jar'
    }
    workingDir featureSmokeClassesDir.get().asFile

    doFirst {
        def os = System.getProperty("os.name").toLowerCase()
        def platformArg

        if (os.contains("win")) {
            platformArg = "-win32"
        } else if (os.contains("mac")) {
            platformArg = "-macos"
        } else if (os.contains("linux")) {
            platformArg = "-linux"
        } else {
            throw new GradleException("Unsupported operating system: ${System.getProperty("os.name")}")
        }

        args = [
            'modernjava/FeatureSmokeApp.class',
            platformArg
        ]
    }
}

tasks.register('captureTcmBoundaryBaseline', JavaExec) {
    group = 'verification'
    description = 'Captures TCM boundary work and timing for the aggregate modern Java smoke conversion.'
    dependsOn 'testClasses', 'copySdkDependencies', 'compileModernJavaFeatureSmoke'

    def mode = providers.gradleProperty('tcmBaselineMode').orElse('none')
    def runName = providers.gradleProperty('tcmBoundaryRun').orElse('baseline')
    def warmups = providers.gradleProperty('tcmBoundaryWarmups').orElse('3')
    def samples = providers.gradleProperty('tcmBoundarySamples').orElse('10')
    def outputDir = layout.buildDirectory.dir(runName.map { "tcm-boundary/${it}" })

    mainClass = 'tc.tools.converter.metadata.TcmBoundaryBaselineMain'
    classpath = sourceSets.test.runtimeClasspath + files(smokeTestSdkJar) + fileTree('dist/libs') {
        include '*.jar'
    }
    workingDir featureSmokeClassesDir.get().asFile
    args = [
        'modernjava/FeatureSmokeApp.class',
        mode.get(),
        outputDir.get().asFile.absolutePath,
        warmups.get(),
        samples.get()
    ]
}


