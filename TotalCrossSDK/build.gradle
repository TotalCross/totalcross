def aggregateCompatibilityBaseline = providers.gradleProperty('aggregateCompatibilityBaseline')
tasks.register('aggregateCompatibilityCheck', me.champeau.gradle.japicmp.JapicmpTask) {
    dependsOn tasks.named('jar')
    if (aggregateCompatibilityBaseline.present) {
        oldClasspath.from(aggregateCompatibilityBaseline.get())
    }
    onlyIf {
        if (!aggregateCompatibilityBaseline.present) {
            logger.lifecycle('Skipping aggregateCompatibilityCheck: set -PaggregateCompatibilityBaseline=<old-sdk.jar> to compare releases')
            return false
        }
        true
    }
    newClasspath.from(tasks.named('jar'))
    onlyModified = true
    onlyBinaryIncompatibleModified = true
    failOnModification = providers.gradleProperty('aggregateCompatibilityStrict')
        .map { it.toBoolean() }.orElse(true).get()
    ignoreMissingClasses = true
    txtOutputFile = layout.buildDirectory.file('reports/aggregate-compatibility.txt').get().asFile
}

