task copySdkDependencies(type: Copy) {
    doFirst {
        delete destinationDir
    }
    from({ configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') } })
    into 'dist/libs'
}

task dist(dependsOn: [build, copySdkDependencies, 'sourcesJar', 'javadocJar']) {
    doLast {
        copy {
            from 'etc/fonts/TCFont.tcz'
            from 'build/libs/TCUI.tcz'
            from 'build/libs/tc.base.lang.tcz'
            from 'build/libs/tc.base.util.tcz'
            from 'build/libs/tc.base.misc.tcz'
            into 'dist/vm/'
        }

        copy {
            from jar.archiveFile
            into 'dist/'
            rename { String fileName ->
                fileName.replace('-' + project.version, '')
            }
        }
    }
}

// All smoke applications are normal Java sources under src/smokeTest/java.
// The built-in compileSmokeTestJava task compiles them once against the
// generated SDK. Compatibility tasks below stage only the package needed by
// each deploy scenario into its historical isolated working directory.
def smokeTestSdkJar = file('dist/totalcross-sdk.jar')
def smokeTestClassesDir = layout.buildDirectory.dir('classes/java/smokeTest')
def smokeTestResourcesDir = layout.buildDirectory.dir('resources/smokeTest')
def featureSmokeClassesDir = layout.buildDirectory.dir('feature-smoke/classes')
def lambdaLoweringFixesClassesDir = layout.buildDirectory.dir('lambda-lowering-fixes/classes')
def lambdaReturnTypesClassesDir = layout.buildDirectory.dir('lambda-return-types-regression/classes')
def axtlsProviderSmokeClassesDir = layout.buildDirectory.dir('axtls-provider-smoke/classes')

tasks.named('compileSmokeTestJava', JavaCompile) {
    destinationDirectory = smokeTestClassesDir
    options.encoding = 'UTF-8'
    options.release.set(17)

    doFirst {
        if (!smokeTestSdkJar.isFile()) {
            throw new GradleException('Run ./gradlew dist -x test before compiling the smoke tests.')
        }
    }
}

tasks.register('smokeTest', Test) {
    group = 'verification'
    description = 'Runs optional JUnit smoke tests from the smokeTest source set.'
    dependsOn tasks.named('classes'), sourceSets.smokeTest.classesTaskName

    testClassesDirs = sourceSets.smokeTest.output.classesDirs
    classpath = files(sourceSets.main.output) + sourceSets.smokeTest.runtimeClasspath
    useJUnitPlatform()
}
def logicalUiScalingSmokeClassesDir = layout.buildDirectory.dir('logical-ui-scaling-smoke/classes')
def logicalUiScalingSmokeSdkJar = file('dist/totalcross-sdk.jar')
def logicalUiScalingSmokeSources = fileTree('src/test/resources/logical-ui-scaling/danfe') {
	include '*.java'
}
def imageAbiSmokeClassesDir = layout.buildDirectory.dir('image-abi-smoke/classes')
def imageDeferredFrameStateSmokeClassesDir = layout.buildDirectory.dir('image-deferred-frame-state-smoke/classes')

def registerImageMacSmoke = { String taskPrefix, String appClass, String smokeDirName,
                              boolean includeImageAbiResources, boolean includeBack3Resource,
                              List requiredFields, List resourceIncludes = [] ->
    def classesDir = layout.buildDirectory.dir(smokeDirName + '/classes')
    tasks.register('compile' + taskPrefix, Sync) {
        group = 'verification'
        description = 'Compiles and stages the ' + appClass + ' smoke app.'
        dependsOn sourceSets.smokeTest.classesTaskName
        from(smokeTestClassesDir) {
            include 'totalcross/ui/image/' + appClass + '*.class'
            include 'totalcross/ui/image/ImageRasterBenchmarkSupport*.class'
        }
        if (includeImageAbiResources) {
            from(smokeTestResourcesDir) {
                include 'image-abi/**'
            }
        }
        if (includeBack3Resource) {
            from('src/main/resources/images/back3.jpg') {
                into 'image-abi'
                rename { 'back3.jpg' }
            }
        }
        resourceIncludes.each { resourceInclude ->
            from(smokeTestResourcesDir) {
                include resourceInclude
            }
        }
        into classesDir
    }

    tasks.register('jar' + taskPrefix, Jar) {
        group = 'verification'
        description = 'Packages the ' + appClass + ' smoke app for deployment.'
        dependsOn 'compile' + taskPrefix
        archiveFileName = appClass + '.jar'
        destinationDirectory = classesDir
        from(classesDir)
    }

    tasks.register('deploy' + taskPrefix + 'MacOS', JavaExec) {
        group = 'verification'
        description = 'Deploys the ' + appClass + ' smoke app for macOS.'
        dependsOn 'copySdkDependencies', 'jar' + taskPrefix
        mainClass = 'tc.Deploy'
        classpath = files(smokeTestSdkJar) + fileTree('dist/libs') {
            include '*.jar'
        }
        workingDir classesDir.get().asFile
        args = [appClass + '.jar', '-macos']
    }

    tasks.register('run' + taskPrefix + 'MacOS', Exec) {
        group = 'verification'
        description = 'Runs the ' + appClass + ' smoke app with the exact macOS dylib.'
        dependsOn 'deploy' + taskPrefix + 'MacOS'
        ignoreExitValue = true
        def smokeOutput = new ByteArrayOutputStream()
        doFirst {
            def nativeRuntime = project.findProperty('tcvmDylib')
            if (!nativeRuntime) {
                throw new GradleException('run' + taskPrefix + 'MacOS requires -PtcvmDylib=<absolute path>')
            }
            def nativeRuntimeFile = file(nativeRuntime).absoluteFile
            if (!nativeRuntimeFile.isFile()) {
                throw new GradleException('Native runtime not found: ' + nativeRuntimeFile)
            }
            def installDir = classesDir.get().dir('install/macos').asFile
            def deployedRuntime = new File(installDir, 'libtcvm.dylib')
            copy {
                from nativeRuntimeFile
                into installDir
                rename { 'libtcvm.dylib' }
            }
            def sourceHash = java.security.MessageDigest.getInstance('SHA-256')
                .digest(nativeRuntimeFile.bytes).encodeHex().toString()
            def deployedHash = java.security.MessageDigest.getInstance('SHA-256')
                .digest(deployedRuntime.bytes).encodeHex().toString()
            if (sourceHash != deployedHash) {
                throw new GradleException('Deployed native runtime hash differs')
            }
            def executable = new File(installDir, appClass)
            if (!executable.isFile()) {
                throw new GradleException('Native smoke executable not found: ' + executable)
            }
            def smokeArguments = project.findProperty('smokeArgs')
            if (smokeArguments) {
                commandLine([executable.absolutePath] + smokeArguments.toString().trim().split(/\s+/).findAll { it })
            } else {
                commandLine executable.absolutePath
            }
            smokeOutput.reset()
            standardOutput = smokeOutput
            errorOutput = smokeOutput
        }
        workingDir classesDir.map { it.dir('install/macos').asFile }
        doLast {
            def output = smokeOutput.toString('UTF-8')
            logger.lifecycle(output.trim())
            def exitCode = executionResult.get().exitValue
            def missing = requiredFields.findAll { !output.contains(it) }
            if (exitCode != 0 || !missing.isEmpty()) {
                throw new GradleException(appClass + ' native macOS smoke failed: exitCode=' + exitCode
                    + ', missing=' + missing)
            }
        }
    }
}

