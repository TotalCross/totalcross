tasks.register('runImageModifierMemorySmokeMacOSWithRss', Exec) {
    group = 'verification'
    description = 'Runs the image modifier memory smoke with external macOS RSS sampling.'
    dependsOn 'deployImageModifierMemorySmokeMacOS'
    def defaultArtifactDir = rootProject.file('artifacts/image-modifier-memory-profile')

    doFirst {
        def nativeRuntime = project.findProperty('tcvmDylib')
        if (!nativeRuntime) {
            throw new GradleException('runImageModifierMemorySmokeMacOSWithRss requires -PtcvmDylib=<absolute path>')
        }
        def nativeRuntimeFile = file(nativeRuntime).absoluteFile
        if (!nativeRuntimeFile.isFile()) {
            throw new GradleException('Native runtime not found: ' + nativeRuntimeFile)
        }
        def installDir = layout.buildDirectory.dir('image-modifier-memory-smoke/classes/install/macos').get().asFile
        def deployedRuntime = new File(installDir, 'libtcvm.dylib')
        copy {
            from nativeRuntimeFile
            into installDir
            rename { 'libtcvm.dylib' }
        }
        def outputFile = file(project.findProperty('memorySmokeOutput')
            ?: new File(defaultArtifactDir, 'smoke.log'))
        def rssFile = file(project.findProperty('memorySmokeRss')
            ?: new File(defaultArtifactDir, 'rss.csv'))
        def summaryFile = file(project.findProperty('memorySmokeSummary')
            ?: new File(defaultArtifactDir, 'rss-summary.txt'))
        outputFile.parentFile.mkdirs()
        rssFile.parentFile.mkdirs()
        summaryFile.parentFile.mkdirs()
        def executable = new File(installDir, 'ImageModifierMemorySmokeApp')
        if (!executable.isFile()) {
            throw new GradleException('Native smoke executable not found: ' + executable)
        }
        commandLine rootProject.file('../scripts/run-image-modifier-memory-smoke.py').absolutePath,
            executable.absolutePath, outputFile.absolutePath, rssFile.absolutePath, summaryFile.absolutePath
        workingDir installDir
    }
}

